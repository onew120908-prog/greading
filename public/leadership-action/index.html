<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leadership Action — 리더십 실행 체크리스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --indigo: #2E2B72;
    --indigo-light: #3D3A8F;
    --indigo-dark: #1E1C4E;
    --amber: #C78B2A;
    --amber-light: #E0A030;
    --cream: #FAF8F3;
    --surface: #FFFFFF;
    --border: #E8E4DB;
    --text: #1A1A2E;
    --muted: #6B6880;
    --red: #C0392B;
    --red-bg: #FDF2F0;
    --blue: #2471A3;
    --blue-bg: #EBF5FB;
    --green: #1E8449;
    --green-bg: #EAFAF1;
    --shadow: 0 2px 12px rgba(46,43,114,0.08);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --cream: #0F0E1A;
      --surface: #1A1830;
      --border: #2E2B4A;
      --text: #E8E6F0;
      --muted: #9896B0;
      --red-bg: #2A1818;
      --blue-bg: #121E2A;
      --green-bg: #0E1E16;
      --shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    background: var(--indigo);
    color: white;
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-icon {
    width: 36px; height: 36px;
    background: var(--amber);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    letter-spacing: 0.3px;
  }
  header p {
    font-size: 11px;
    opacity: 0.65;
    margin-top: 2px;
    letter-spacing: 0.5px;
  }
  .header-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .btn-api {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: white;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s;
  }
  .btn-api:hover { background: rgba(255,255,255,0.2); }

  /* ── Layout ── */
  .layout {
    display: flex;
    flex: 1;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
    padding: 24px 20px;
    gap: 20px;
  }

  /* ── Left Panel ── */
  .panel-left {
    width: 360px;
    min-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .card-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .doc-type-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .doc-type-btn {
    border: 1.5px solid var(--border);
    background: transparent;
    border-radius: 8px;
    padding: 10px 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    color: var(--text);
    transition: all 0.2s;
    text-align: center;
  }
  .doc-type-btn:hover { border-color: var(--indigo-light); background: var(--cream); }
  .doc-type-btn.active {
    border-color: var(--indigo);
    background: var(--indigo);
    color: white;
  }
  .doc-type-icon { font-size: 16px; display: block; margin-bottom: 4px; }
  textarea#inputText {
    width: 100%;
    min-height: 220px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    font-family: inherit;
    font-size: 13px;
    resize: vertical;
    background: var(--cream);
    color: var(--text);
    line-height: 1.6;
    transition: border-color 0.2s;
  }
  textarea#inputText:focus { outline: none; border-color: var(--indigo-light); }
  .char-count {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    margin-top: 4px;
  }
  .btn-analyze {
    width: 100%;
    background: var(--indigo);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.2s, transform 0.1s;
    margin-top: 4px;
  }
  .btn-analyze:hover { background: var(--indigo-light); }
  .btn-analyze:active { transform: scale(0.98); }
  .btn-analyze:disabled { opacity: 0.6; cursor: not-allowed; }

  /* Sessions */
  .sessions-list { display: flex; flex-direction: column; gap: 8px; }
  .session-item {
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .session-item:hover { border-color: var(--indigo-light); background: var(--cream); }
  .session-item.active { border-color: var(--indigo); background: rgba(46,43,114,0.04); }
  .session-title { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .session-meta { font-size: 11px; color: var(--muted); display: flex; gap: 10px; }
  .session-progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
  }
  .session-progress-fill {
    height: 100%;
    background: var(--amber);
    border-radius: 2px;
    transition: width 0.4s;
  }
  .no-sessions {
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 13px;
  }

  /* ── Right Panel ── */
  .panel-right {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Result Header */
  .result-header {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 24px;
    box-shadow: var(--shadow);
  }
  .progress-ring-wrap {
    position: relative;
    width: 72px; height: 72px;
    flex-shrink: 0;
  }
  .progress-ring-wrap svg { transform: rotate(-90deg); }
  .progress-ring-bg { fill: none; stroke: var(--border); stroke-width: 6; }
  .progress-ring-fill {
    fill: none;
    stroke: var(--amber);
    stroke-width: 6;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.6s ease;
  }
  .progress-ring-text {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 15px;
    font-weight: 700;
    color: var(--indigo);
  }
  .result-info { flex: 1; }
  .result-title {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    color: var(--indigo);
    margin-bottom: 6px;
  }
  .result-subtitle { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .result-tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
  }
  .tag-imm { background: var(--red-bg); color: var(--red); }
  .tag-sht { background: var(--blue-bg); color: var(--blue); }
  .tag-lng { background: var(--green-bg); color: var(--green); }

  /* Streaming indicator */
  .streaming-indicator {
    display: none;
    align-items: center;
    gap: 8px;
    color: var(--indigo);
    font-size: 13px;
  }
  .streaming-indicator.active { display: flex; }
  .dot-pulse {
    display: flex; gap: 4px;
  }
  .dot-pulse span {
    width: 6px; height: 6px;
    background: var(--amber);
    border-radius: 50%;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
  .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
    30% { opacity: 1; transform: scale(1); }
  }

  /* Lanes */
  .lanes { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .lane {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .lane-header {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
  }
  .lane-imm .lane-header { background: var(--red-bg); }
  .lane-sht .lane-header { background: var(--blue-bg); }
  .lane-lng .lane-header { background: var(--green-bg); }
  .lane-icon { font-size: 18px; }
  .lane-title-wrap { flex: 1; }
  .lane-title { font-size: 13px; font-weight: 600; }
  .lane-imm .lane-title { color: var(--red); }
  .lane-sht .lane-title { color: var(--blue); }
  .lane-lng .lane-title { color: var(--green); }
  .lane-subtitle { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .lane-count {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
  }
  .lane-imm .lane-count { background: rgba(192,57,43,0.12); color: var(--red); }
  .lane-sht .lane-count { background: rgba(36,113,163,0.12); color: var(--blue); }
  .lane-lng .lane-count { background: rgba(30,132,73,0.12); color: var(--green); }
  .lane-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

  /* Action Item */
  .action-item {
    border: 1.5px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .action-item:hover { box-shadow: 0 2px 8px rgba(46,43,114,0.1); }
  .action-item.done { opacity: 0.6; }
  .action-item-main {
    padding: 12px 14px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .check-wrap {
    flex-shrink: 0;
    margin-top: 2px;
  }
  .check-wrap input[type="checkbox"] {
    width: 18px; height: 18px;
    cursor: pointer;
    accent-color: var(--amber);
  }
  .action-content { flex: 1; min-width: 0; }
  .action-title {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.5;
    margin-bottom: 5px;
  }
  .action-item.done .action-title {
    text-decoration: line-through;
    color: var(--muted);
  }
  .action-why {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
  }
  .action-footer {
    padding: 8px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .btn-memo {
    font-size: 11px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    padding: 2px 6px;
    border-radius: 4px;
    transition: background 0.2s, color 0.2s;
  }
  .btn-memo:hover { background: var(--border); color: var(--text); }
  .memo-area {
    display: none;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    background: var(--cream);
  }
  .memo-area.open { display: block; }
  .memo-textarea {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-family: inherit;
    font-size: 12px;
    background: var(--surface);
    color: var(--text);
    resize: vertical;
    min-height: 70px;
    line-height: 1.6;
  }
  .memo-textarea:focus { outline: none; border-color: var(--indigo-light); }

  /* Empty state */
  .empty-state {
    padding: 48px 24px;
    text-align: center;
    color: var(--muted);
  }
  .empty-icon { font-size: 36px; margin-bottom: 12px; }
  .empty-title { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
  .empty-desc { font-size: 13px; line-height: 1.6; }

  /* API Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 16px;
    padding: 28px;
    max-width: 420px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal h2 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--indigo);
    margin-bottom: 8px;
  }
  .modal p { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 16px; }
  .modal input {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 13px;
    background: var(--cream);
    color: var(--text);
    margin-bottom: 12px;
    letter-spacing: 0.5px;
  }
  .modal input:focus { outline: none; border-color: var(--indigo-light); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .btn-cancel {
    padding: 10px 18px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
  }
  .btn-save {
    padding: 10px 18px;
    background: var(--indigo);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
  }

  @media (max-width: 900px) {
    .layout { flex-direction: column; }
    .panel-left { width: 100%; min-width: unset; }
    .lanes { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="header-icon">⚡</div>
    <div>
      <h1>Leadership Action</h1>
      <p>회의록 · 리더십 철학 → 실행 체크리스트</p>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn-api" onclick="openApiModal()">🔑 API 키 설정</button>
  </div>
</header>

<div class="layout">
  <!-- Left Panel -->
  <div class="panel-left">
    <div class="card">
      <div class="card-title">문서 유형</div>
      <div class="doc-type-grid">
        <button class="doc-type-btn active" data-type="meeting" onclick="setDocType(this)">
          <span class="doc-type-icon">📋</span>회의록
        </button>
        <button class="doc-type-btn" data-type="vision" onclick="setDocType(this)">
          <span class="doc-type-icon">🎯</span>비전/철학
        </button>
        <button class="doc-type-btn" data-type="feedback" onclick="setDocType(this)">
          <span class="doc-type-icon">💬</span>피드백
        </button>
        <button class="doc-type-btn" data-type="plan" onclick="setDocType(this)">
          <span class="doc-type-icon">📐</span>계획서
        </button>
      </div>
      <textarea id="inputText" placeholder="회의록이나 리더십 메시지를 붙여넣으세요...&#10;&#10;Claude가 실행 가능한 액션 아이템을 추출해 드립니다."></textarea>
      <div class="char-count"><span id="charCount">0</span>자</div>
      <button class="btn-analyze" id="analyzeBtn" onclick="analyze()">
        <span id="analyzeBtnIcon">✦</span>
        <span id="analyzeBtnText">액션 아이템 추출하기</span>
      </button>
    </div>

    <div class="card">
      <div class="card-title">저장된 세션</div>
      <div class="sessions-list" id="sessionsList">
        <div class="no-sessions">아직 분석된 세션이 없어요</div>
      </div>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="panel-right">
    <!-- Result Header -->
    <div class="result-header" id="resultHeader" style="display:none">
      <div class="progress-ring-wrap">
        <svg width="72" height="72" viewBox="0 0 72 72">
          <circle class="progress-ring-bg" cx="36" cy="36" r="30"/>
          <circle class="progress-ring-fill" id="progressRing" cx="36" cy="36" r="30"
            stroke-dasharray="188.5"
            stroke-dashoffset="188.5"/>
        </svg>
        <div class="progress-ring-text" id="progressText">0%</div>
      </div>
      <div class="result-info">
        <div class="result-title" id="resultTitle">분석 결과</div>
        <div class="result-subtitle" id="resultSubtitle"></div>
        <div class="result-tags" id="resultTags"></div>
      </div>
      <div class="streaming-indicator" id="streamingIndicator">
        <div class="dot-pulse">
          <span></span><span></span><span></span>
        </div>
        <span>분석 중...</span>
      </div>
    </div>

    <!-- Lanes -->
    <div class="lanes" id="lanesContainer">
      <div class="empty-state" style="grid-column:1/-1">
        <div class="empty-icon">✦</div>
        <div class="empty-title">아직 분석된 내용이 없어요</div>
        <div class="empty-desc">왼쪽에 회의록이나 리더십 메시지를 붙여넣고<br>「액션 아이템 추출하기」를 눌러보세요</div>
      </div>
    </div>
  </div>
</div>

<!-- API Key Modal -->
<div class="modal-overlay" id="apiModal">
  <div class="modal">
    <h2>🔑 Claude API 키</h2>
    <p>Anthropic Console에서 발급받은 API 키를 입력하세요. 키는 이 기기에만 저장되며 외부로 전송되지 않습니다.</p>
    <input type="password" id="apiKeyInput" placeholder="sk-ant-...">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeApiModal()">취소</button>
      <button class="btn-save" onclick="saveApiKey()">저장</button>
    </div>
  </div>
</div>

<script>
// ── State ──
let docType = 'meeting';
let sessions = JSON.parse(localStorage.getItem('la_sessions') || '[]');
let currentSessionId = null;

const DOC_LABELS = {
  meeting: '회의록',
  vision: '비전/철학',
  feedback: '피드백',
  plan: '계획서'
};

const LANE_CONFIG = {
  imm: { label: '즉시 실행', sub: '이번 주 안에', icon: '🔥', cls: 'lane-imm', tagCls: 'tag-imm' },
  sht: { label: '단기 과제', sub: '1개월 이내', icon: '📌', cls: 'lane-sht', tagCls: 'tag-sht' },
  lng: { label: '장기 목표', sub: '분기 ~ 연간', icon: '🌱', cls: 'lane-lng', tagCls: 'tag-lng' }
};

// ── Init ──
document.getElementById('inputText').addEventListener('input', e => {
  document.getElementById('charCount').textContent = e.target.value.length.toLocaleString();
});

renderSessions();

// ── Doc Type ──
function setDocType(btn) {
  document.querySelectorAll('.doc-type-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  docType = btn.dataset.type;
}

// ── API Key Modal ──
function openApiModal() {
  const key = localStorage.getItem('la_api_key') || '';
  document.getElementById('apiKeyInput').value = key ? '••••••••' + key.slice(-4) : '';
  document.getElementById('apiModal').classList.add('open');
  setTimeout(() => document.getElementById('apiKeyInput').focus(), 100);
}
function closeApiModal() {
  document.getElementById('apiModal').classList.remove('open');
}
function saveApiKey() {
  const val = document.getElementById('apiKeyInput').value.trim();
  if (val && !val.startsWith('•')) {
    localStorage.setItem('la_api_key', val);
  }
  closeApiModal();
}
document.getElementById('apiModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeApiModal();
});

// ── Analyze ──
async function analyze() {
  const text = document.getElementById('inputText').value.trim();
  if (!text) { alert('텍스트를 입력해주세요.'); return; }

  const apiKey = localStorage.getItem('la_api_key');
  if (!apiKey) { openApiModal(); return; }

  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  document.getElementById('analyzeBtnText').textContent = '분석 중...';
  document.getElementById('analyzeBtnIcon').textContent = '⏳';

  // Show streaming header
  document.getElementById('resultHeader').style.display = 'flex';
  document.getElementById('streamingIndicator').classList.add('active');
  document.getElementById('resultTitle').textContent = '분석 중...';
  document.getElementById('resultSubtitle').textContent = '';
  document.getElementById('resultTags').innerHTML = '';
  document.getElementById('lanesContainer').innerHTML = renderEmptyLanes();

  const systemPrompt = `당신은 리더십 문서에서 실행 가능한 액션 아이템을 추출하는 전문가입니다.
주어진 텍스트(${DOC_LABELS[docType]})를 분석하여 다음 JSON 형식으로 응답하세요.

{
  "title": "문서 핵심 주제 (20자 이내)",
  "summary": "한 문장 요약 (50자 이내)",
  "items": [
    {
      "priority": "imm|sht|lng",
      "title": "구체적 액션 (동사로 시작, 30자 이내)",
      "why": "이것이 중요한 이유 (40자 이내)"
    }
  ]
}

규칙:
- priority: imm(즉시/이번주), sht(단기/1개월), lng(장기/분기이상)
- items: 최소 5개, 최대 10개
- 추상적 목표가 아닌 구체적 행동으로 작성
- JSON만 응답 (다른 텍스트 없이)`;

  let buffer = '';
  let parsed = null;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-ipc': 'true'
      },
      body: JSON.stringify({
        model: 'claude-opus-5',
        max_tokens: 1500,
        stream: true,
        system: systemPrompt,
        messages: [{ role: 'user', content: text }]
      })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || `API 오류 ${response.status}`);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value);
      const lines = chunk.split('\n');
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try {
          const event = JSON.parse(data);
          if (event.type === 'content_block_delta' && event.delta?.text) {
            buffer += event.delta.text;
            // Try partial parse
            const match = buffer.match(/\{[\s\S]*\}/);
            if (match) {
              try { parsed = JSON.parse(match[0]); } catch {}
            }
          }
        } catch {}
      }
    }

    // Final parse
    const finalMatch = buffer.match(/\{[\s\S]*\}/);
    if (finalMatch) {
      try { parsed = JSON.parse(finalMatch[0]); } catch {}
    }

    if (!parsed) throw new Error('응답 파싱 실패. 다시 시도해주세요.');

    // Save session
    const session = {
      id: Date.now().toString(),
      title: parsed.title || '분석 결과',
      summary: parsed.summary || '',
      docType,
      items: parsed.items || [],
      createdAt: new Date().toISOString(),
      text: text.slice(0, 200)
    };
    sessions.unshift(session);
    localStorage.setItem('la_sessions', JSON.stringify(sessions));
    currentSessionId = session.id;

    renderResult(session);
    renderSessions();

  } catch (err) {
    console.error(err);
    document.getElementById('lanesContainer').innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="empty-icon">⚠️</div>
        <div class="empty-title">오류가 발생했어요</div>
        <div class="empty-desc">${err.message}</div>
      </div>`;
    document.getElementById('resultHeader').style.display = 'none';
  } finally {
    btn.disabled = false;
    document.getElementById('analyzeBtnText').textContent = '액션 아이템 추출하기';
    document.getElementById('analyzeBtnIcon').textContent = '✦';
    document.getElementById('streamingIndicator').classList.remove('active');
  }
}

// ── Render ──
function renderEmptyLanes() {
  return Object.entries(LANE_CONFIG).map(([key, cfg]) => `
    <div class="lane ${cfg.cls}">
      <div class="lane-header">
        <span class="lane-icon">${cfg.icon}</span>
        <div class="lane-title-wrap">
          <div class="lane-title">${cfg.label}</div>
          <div class="lane-subtitle">${cfg.sub}</div>
        </div>
        <span class="lane-count">0</span>
      </div>
      <div class="lane-body"></div>
    </div>`).join('');
}

function renderResult(session) {
  const items = session.items || [];
  const done = items.filter(i => i.done).length;
  const pct = items.length ? Math.round(done / items.length * 100) : 0;

  // Header
  document.getElementById('resultTitle').textContent = session.title;
  document.getElementById('resultSubtitle').textContent = session.summary;

  // Tags
  const counts = { imm: 0, sht: 0, lng: 0 };
  items.forEach(i => { if (counts[i.priority] !== undefined) counts[i.priority]++; });
  document.getElementById('resultTags').innerHTML = Object.entries(counts)
    .filter(([,n]) => n > 0)
    .map(([k, n]) => `<span class="tag ${LANE_CONFIG[k].tagCls}">${LANE_CONFIG[k].icon} ${LANE_CONFIG[k].label} ${n}</span>`)
    .join('');

  updateProgress(pct);

  // Lanes
  document.getElementById('lanesContainer').innerHTML = Object.entries(LANE_CONFIG).map(([key, cfg]) => {
    const laneItems = items.filter(i => i.priority === key);
    return `
      <div class="lane ${cfg.cls}">
        <div class="lane-header">
          <span class="lane-icon">${cfg.icon}</span>
          <div class="lane-title-wrap">
            <div class="lane-title">${cfg.label}</div>
            <div class="lane-subtitle">${cfg.sub}</div>
          </div>
          <span class="lane-count">${laneItems.length}</span>
        </div>
        <div class="lane-body">
          ${laneItems.length === 0
            ? '<div style="padding:16px;text-align:center;font-size:12px;color:var(--muted)">해당 없음</div>'
            : laneItems.map((item, idx) => renderActionItem(session.id, item, idx)).join('')}
        </div>
      </div>`;
  }).join('');
}

function renderActionItem(sessionId, item, idx) {
  const uid = `${sessionId}_${item.priority}_${idx}`;
  return `
    <div class="action-item ${item.done ? 'done' : ''}" id="item_${uid}">
      <div class="action-item-main">
        <div class="check-wrap">
          <input type="checkbox" ${item.done ? 'checked' : ''}
            onchange="toggleItem('${sessionId}', '${item.priority}', ${idx}, this.checked)">
        </div>
        <div class="action-content">
          <div class="action-title">${escHtml(item.title)}</div>
          <div class="action-why">${escHtml(item.why || '')}</div>
        </div>
      </div>
      <div class="action-footer">
        <button class="btn-memo" onclick="toggleMemo('${uid}')">📝 메모</button>
        ${item.memo ? `<span style="font-size:11px;color:var(--muted)">메모 있음</span>` : ''}
      </div>
      <div class="memo-area ${item.memo ? 'open' : ''}" id="memo_${uid}">
        <textarea class="memo-textarea" placeholder="실행 중 메모..."
          onchange="saveMemo('${sessionId}', '${item.priority}', ${idx}, this.value)"
        >${escHtml(item.memo || '')}</textarea>
      </div>
    </div>`;
}

function toggleMemo(uid) {
  const area = document.getElementById('memo_' + uid);
  area.classList.toggle('open');
  if (area.classList.contains('open')) area.querySelector('textarea').focus();
}

function toggleItem(sessionId, priority, idx, checked) {
  const session = sessions.find(s => s.id === sessionId);
  if (!session) return;
  const laneItems = session.items.filter(i => i.priority === priority);
  laneItems[idx].done = checked;
  localStorage.setItem('la_sessions', JSON.stringify(sessions));

  const uid = `${sessionId}_${priority}_${idx}`;
  document.getElementById('item_' + uid)?.classList.toggle('done', checked);

  const done = session.items.filter(i => i.done).length;
  const pct = session.items.length ? Math.round(done / session.items.length * 100) : 0;
  updateProgress(pct);
  renderSessions();
}

function saveMemo(sessionId, priority, idx, text) {
  const session = sessions.find(s => s.id === sessionId);
  if (!session) return;
  const laneItems = session.items.filter(i => i.priority === priority);
  laneItems[idx].memo = text;
  localStorage.setItem('la_sessions', JSON.stringify(sessions));
}

function updateProgress(pct) {
  const circumference = 188.5;
  const offset = circumference - (pct / 100 * circumference);
  document.getElementById('progressRing').style.strokeDashoffset = offset;
  document.getElementById('progressText').textContent = pct + '%';
}

function renderSessions() {
  const list = document.getElementById('sessionsList');
  if (sessions.length === 0) {
    list.innerHTML = '<div class="no-sessions">아직 분석된 세션이 없어요</div>';
    return;
  }
  list.innerHTML = sessions.map(s => {
    const done = (s.items || []).filter(i => i.done).length;
    const total = (s.items || []).length;
    const pct = total ? Math.round(done / total * 100) : 0;
    const date = new Date(s.createdAt).toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });
    return `
      <div class="session-item ${s.id === currentSessionId ? 'active' : ''}" onclick="loadSession('${s.id}')">
        <div class="session-title">${escHtml(s.title)}</div>
        <div class="session-meta">
          <span>${DOC_LABELS[s.docType] || s.docType}</span>
          <span>${date}</span>
          <span>${done}/${total} 완료</span>
        </div>
        <div class="session-progress-bar">
          <div class="session-progress-fill" style="width:${pct}%"></div>
        </div>
      </div>`;
  }).join('');
}

function loadSession(id) {
  const session = sessions.find(s => s.id === id);
  if (!session) return;
  currentSessionId = id;
  document.getElementById('resultHeader').style.display = 'flex';
  renderResult(session);
  renderSessions();
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
</script>
</body>
</html>
