<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>새벽 출정호 항해 지도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyCMLgfKcPF-gMWrRtLUzvYqQKj4m93HP-M",
  authDomain: "reading-a8c63.firebaseapp.com",
  projectId: "reading-a8c63",
  storageBucket: "reading-a8c63.firebasestorage.app",
  messagingSenderId: "1091833569255",
  appId: "1:1091833569255:web:94f29a5aa2d996bcf86742"
});
const db = firebase.firestore();
</script>
<style>
  :root {
    --sea:#2C5F7A; --sea-lt:#4E8FA8; --sand:#E8D9B5; --parch:#F5EDD8;
    --ink:#2A1F0F; --ink-soft:#6B5A3E; --gold:#C8912A; --aslan:#E8B84B;
    --card:#FDFAF3; --border:#D4C49A;
  }
  @media (prefers-color-scheme:dark){
    :root{ --sea:#1A3D52; --sea-lt:#2E6480; --sand:#3D3020; --parch:#2A2010;
      --ink:#EDE0C8; --ink-soft:#B09870; --gold:#D4A040; --aslan:#C8A030;
      --card:#251C10; --border:#5A4A28; color-scheme:dark; }
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{
    margin:0; background:var(--parch); color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    padding:32px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));
  }
  .page{ max-width:760px; margin:0 auto; }

  /* 이름 입력 화면 */
  .name-gate{ display:flex; flex-direction:column; align-items:center; gap:16px; padding:40px 0; text-align:center; }
  .name-gate h2{ font-family:'Noto Serif KR',serif; color:var(--sea); margin:0; font-size:18px; }
  .name-gate p{ color:var(--ink-soft); font-size:13px; margin:0; line-height:1.7; }
  .name-input{
    width:100%; max-width:280px; padding:10px 14px;
    border:1.5px solid var(--border); border-radius:8px;
    background:var(--card); color:var(--ink);
    font-family:'Noto Sans KR',sans-serif; font-size:15px; text-align:center;
  }
  .name-input:focus{ outline:none; border-color:var(--sea); }
  .start-btn{
    padding:10px 28px; background:var(--sea); color:#fff;
    border:none; border-radius:8px; font-size:15px; font-weight:600;
    cursor:pointer; font-family:'Noto Sans KR',sans-serif;
  }
  .start-btn:hover{ opacity:.85; }

  /* 상단 학생 표시 */
  .student-bar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px; padding:8px 12px;
    background:var(--card); border:1px solid var(--border); border-radius:8px; font-size:13px;
  }
  .student-bar strong{ color:var(--sea); }
  .student-bar button{ background:none; border:none; color:var(--ink-soft); font-size:12px; cursor:pointer; padding:2px 6px; text-decoration:underline; }
  .save-status{ text-align:center; font-size:11px; color:var(--ink-soft); margin-bottom:12px; min-height:16px; }

  header{ text-align:center; margin-bottom:36px; }
  .ship-icon{ font-size:36px; margin-bottom:8px; }
  h1{ font-family:'Noto Serif KR',serif; font-size:clamp(1.3rem,4vw,1.9rem); font-weight:700; color:var(--sea); margin:0 0 6px; }
  .subtitle{ font-size:13px; color:var(--ink-soft); margin:0; }

  .route{ position:relative; display:flex; flex-direction:column; gap:0; }
  .route::before{
    content:''; position:absolute; left:50%; top:24px; bottom:24px; width:3px;
    transform:translateX(-50%);
    background:repeating-linear-gradient(to bottom,var(--sea-lt) 0,var(--sea-lt) 8px,transparent 8px,transparent 16px);
    z-index:0;
  }
  .stop{ display:grid; grid-template-columns:1fr 48px 1fr; align-items:start; gap:12px; position:relative; z-index:1; margin-bottom:8px; }
  .stop.right .card{ grid-column:3; grid-row:1; }
  .stop.right .dot-col{ grid-column:2; grid-row:1; }
  .stop.right .empty{ grid-column:1; grid-row:1; }
  .stop.left .card{ grid-column:1; grid-row:1; }
  .stop.left .dot-col{ grid-column:2; grid-row:1; }
  .stop.left .empty{ grid-column:3; grid-row:1; }
  .dot-col{ display:flex; flex-direction:column; align-items:center; gap:4px; padding-top:10px; }
  .dot{ width:20px; height:20px; border-radius:50%; border:3px solid var(--sea); background:var(--gold); flex-shrink:0; }
  .dot.start{ background:var(--sea); border-color:var(--sea); }
  .dot.end{ background:var(--aslan); border-color:var(--gold); width:26px; height:26px; }
  .num{ font-size:10px; font-weight:700; color:var(--ink-soft); letter-spacing:.05em; }

  .card{ background:var(--card); border:1.5px solid var(--border); border-radius:10px; padding:12px 14px; box-shadow:0 2px 6px rgba(0,0,0,.07); }
  .card-top{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .island-icon{ font-size:20px; flex-shrink:0; }
  .island-name{ font-family:'Noto Serif KR',serif; font-size:14px; font-weight:700; color:var(--sea); line-height:1.3; }
  .island-name small{ display:block; font-family:'Noto Sans KR',sans-serif; font-size:11px; font-weight:400; color:var(--ink-soft); }
  .what-happened{ font-size:12.5px; color:var(--ink); line-height:1.65; margin:0 0 6px; }
  .lesson-label{ font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); margin-bottom:2px; }
  .lesson{ font-size:12px; color:var(--ink-soft); line-height:1.6; margin:0; border-left:2px solid var(--gold); padding-left:8px; }
  .write-box{
    margin-top:8px; width:100%; min-height:60px;
    background:var(--sand); border:1px solid var(--border); border-radius:6px;
    padding:6px 10px; font-family:'Noto Sans KR',sans-serif;
    font-size:12px; color:var(--ink); resize:vertical; line-height:1.6;
  }
  .write-box::placeholder{ color:var(--ink-soft); font-style:italic; }

  .summary-box{ margin-top:36px; background:var(--card); border:2px solid var(--gold); border-radius:12px; padding:20px 22px; }
  .summary-box h2{ font-family:'Noto Serif KR',serif; font-size:15px; color:var(--gold); margin:0 0 10px; }
  .summary-lines{ display:flex; flex-direction:column; gap:8px; }
  .summary-line{ display:flex; gap:10px; align-items:flex-start; font-size:12.5px; }
  .summary-label{ font-weight:700; color:var(--sea); white-space:nowrap; min-width:70px; }
  .summary-write{
    flex:1; background:var(--sand); border:1px solid var(--border); border-radius:6px;
    padding:5px 8px; min-height:36px; font-family:'Noto Sans KR',sans-serif;
    font-size:12px; color:var(--ink); resize:vertical; line-height:1.6;
  }
  .summary-write::placeholder{ color:var(--ink-soft); font-style:italic; }

  .save-btn{
    display:block; margin:28px auto 0; padding:11px 32px;
    background:var(--sea); color:#fff; border:none; border-radius:8px;
    font-size:14px; font-weight:600; cursor:pointer; font-family:'Noto Sans KR',sans-serif;
  }
  .save-btn:hover{ opacity:.85; }
  .save-btn:disabled{ opacity:.5; cursor:default; }

  @media (max-width:520px){
    .route::before{ left:20px; transform:none; }
    .stop{ grid-template-columns:40px 1fr; }
    .stop.right .card,.stop.left .card{ grid-column:2; grid-row:1; }
    .stop.right .dot-col,.stop.left .dot-col{ grid-column:1; grid-row:1; }
    .stop.right .empty,.stop.left .empty{ display:none; }
  }
</style>
</head>
<body>
<div class="page" id="app"></div>

<script>
const STOPS = [
  { key:'s1', icon:'🏰', name:'나니아 출발', en:'Narrowhaven · 론 아일랜즈', dot:'start', num:'출발',
    what:'캐스피언 왕, 에드먼드·루시·유스터스가 새벽 출정호에 올라 동쪽 바다로 떠남. 론 아일랜즈에서 노예 상인을 처단하고 질서를 되찾음.',
    lesson:'지도자는 불의를 보았을 때 외면하지 않는다.' },
  { key:'s2', icon:'🐉', name:'용 섬', en:'Dragon Island', dot:'', num:'02',
    what:'유스터스가 용의 보물을 욕심내다 잠든 사이 용으로 변함. 아슬란이 직접 용의 껍질을 벗겨 소년으로 돌아오게 함.',
    lesson:'탐욕은 사람을 짐승으로 만들고, 혼자서는 벗어날 수 없는 껍질이 있다.' },
  { key:'s3', icon:'👣', name:'목소리들의 섬', en:'Island of the Voices', dot:'', num:'03',
    what:'보이지 않는 쿵쿵이들이 루시에게 마법사의 집에서 투명 해제 주문을 찾아오라고 협박. 루시 혼자 위험을 감수하고 임무를 완수함.',
    lesson:'보이지 않는 위협 앞에서의 용기가 더 어렵고 더 값지다.' },
  { key:'s4', icon:'🌑', name:'어둠의 섬', en:'Dark Island', dot:'', num:'04',
    what:'꿈이 현실이 되는 섬. 귀족 로프를 구출하지만 일행도 악몽에 사로잡힐 뻔함. 아슬란의 빛으로 탈출.',
    lesson:'원하는 모든 것이 이루어지는 세계가 반드시 행복한 세계는 아니다.' },
  { key:'s5', icon:'⭐', name:'라만두의 섬', en:"Ramandu's Island", dot:'', num:'05',
    what:'잠든 세 귀족 발견. 아슬란의 식탁에서 금지된 칼을 집어 들고 다툼을 벌인 결과로 저주를 받아 잠든 것임. 세계의 끝까지 항해해야 저주가 풀린다는 사실을 알게 됨.',
    lesson:'행동에는 반드시 결과가 따른다. 끝까지 가야만 돌아올 수 있다.' },
  { key:'s6', icon:'🌊', name:'세계의 끝 · 최후의 바다', en:"The Last Sea · Aslan's Country", dot:'end', num:'끝',
    what:'바닷물이 맑고 달콤해짐. 리피칩은 아슬란의 나라로 혼자 나아가고, 에드먼드·루시는 나니아에 마지막으로 작별을 고함. 유스터스는 완전히 다른 사람이 됨.',
    lesson:'세상의 끝은 소멸이 아니라 정화. 끝이 항상 상실만을 의미하지는 않는다.' },
];

const app = document.getElementById('app');
let studentName = null;
let answers = {};
let saveTimer = null;

function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function showGate(){
  app.innerHTML = `
    <header>
      <div class="ship-icon">⛵</div>
      <h1>새벽 출정호 항해 지도</h1>
      <p class="subtitle">나니아 연대기 · 새벽 출정호의 항해</p>
    </header>
    <div class="name-gate">
      <h2>이름을 입력해 주세요</h2>
      <p>입력하면 기록이 저장되고<br>다음에 다시 열어도 내용이 남아 있어요.</p>
      <input class="name-input" id="name-input" type="text" placeholder="예: 홍길동" maxlength="20" autocomplete="off">
      <button class="start-btn" id="start-btn">시작하기 ⛵</button>
    </div>`;
  const inp = document.getElementById('name-input');
  const btn = document.getElementById('start-btn');
  inp.focus();
  inp.onkeydown = e => { if(e.key==='Enter') btn.click(); };
  btn.onclick = async () => {
    const name = inp.value.trim();
    if(!name){ inp.style.borderColor='#c00'; return; }
    btn.disabled = true; btn.textContent = '불러오는 중...';
    studentName = name;
    try {
      const doc = await db.collection('dawn-treader').doc(name).get();
      answers = (doc.exists && doc.data() && doc.data().answers) ? doc.data().answers : {};
    } catch(e){ answers = {}; }
    showMap();
  };
}

function showMap(){
  const stopsHtml = STOPS.map((s, i) => {
    const side = i % 2 === 0 ? 'left' : 'right';
    const val = esc(answers[s.key] || '');
    const card = `
      <div class="card">
        <div class="card-top">
          <span class="island-icon">${s.icon}</span>
          <div class="island-name">${esc(s.name)}<small>${esc(s.en)}</small></div>
        </div>
        <p class="what-happened">${esc(s.what)}</p>
        <div class="lesson-label">이 섬에서 배운 것</div>
        <p class="lesson">${esc(s.lesson)}</p>
        <textarea class="write-box" data-key="${s.key}" placeholder="✏️ 이 섬에서 기억에 남은 장면을 써 보세요">${val}</textarea>
      </div>`;
    const dot = `<div class="dot-col"><div class="dot ${s.dot}"></div><div class="num">${s.num}</div></div>`;
    const empty = `<div class="empty"></div>`;
    return side === 'left'
      ? `<div class="stop left">${card}${dot}${empty}</div>`
      : `<div class="stop right">${empty}${dot}${card}</div>`;
  }).join('');

  app.innerHTML = `
    <header>
      <div class="ship-icon">⛵</div>
      <h1>새벽 출정호 항해 지도</h1>
      <p class="subtitle">나니아 연대기 · 새벽 출정호의 항해</p>
    </header>
    <div class="student-bar">
      <span>⛵ <strong>${esc(studentName)}</strong>의 항해 기록</span>
      <button id="change-name">이름 바꾸기</button>
    </div>
    <div class="save-status" id="save-status"></div>
    <div class="route">${stopsHtml}</div>
    <div class="summary-box">
      <h2>✍️ 항해를 마치고</h2>
      <div class="summary-lines">
        <div class="summary-line">
          <span class="summary-label">가장 인상 깊은 섬</span>
          <textarea class="summary-write" data-key="q1" placeholder="섬 이름과 이유를 써 보세요">${esc(answers.q1||'')}</textarea>
        </div>
        <div class="summary-line">
          <span class="summary-label">가장 많이 변한 인물</span>
          <textarea class="summary-write" data-key="q2" placeholder="누가, 어떻게 변했나요?">${esc(answers.q2||'')}</textarea>
        </div>
        <div class="summary-line">
          <span class="summary-label">한 문장 요약</span>
          <textarea class="summary-write" data-key="q3" placeholder="이 항해 전체를 한 문장으로 요약한다면?">${esc(answers.q3||'')}</textarea>
        </div>
      </div>
    </div>
    <button class="save-btn" id="save-btn">저장하기</button>`;

  document.getElementById('change-name').onclick = () => { studentName=null; answers={}; showGate(); };

  app.querySelectorAll('[data-key]').forEach(ta => {
    ta.addEventListener('input', () => {
      answers[ta.dataset.key] = ta.value;
      clearTimeout(saveTimer);
      setStatus('수정 중...');
      saveTimer = setTimeout(save, 2000);
    });
  });
  document.getElementById('save-btn').onclick = save;
}

function setStatus(msg){
  const el = document.getElementById('save-status');
  if(el) el.textContent = msg;
}

async function save(){
  const btn = document.getElementById('save-btn');
  if(btn){ btn.disabled=true; btn.textContent='저장 중...'; }
  setStatus('저장 중...');
  try {
    await db.collection('dawn-treader').doc(studentName).set({ answers, updatedAt: Date.now() });
    setStatus('✅ 저장됐어요 · ' + new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));
  } catch(e){
    setStatus('❌ 저장 실패: ' + e.message);
  }
  if(btn){ btn.disabled=false; btn.textContent='저장하기'; }
}

showGate();
</script>
</body>
</html>
