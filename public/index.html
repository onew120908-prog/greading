<style>
  /* ===== SPLASH ===== */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(150deg, #0a1f16 0%, #1E4235 35%, #2F5D4E 65%, #0d2b1e 100%);
    overflow: hidden;
  }
  #splash::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 30% 40%, rgba(212,175,55,0.15) 0%, transparent 70%),
      radial-gradient(ellipse 50% 60% at 75% 65%, rgba(47,93,78,0.4) 0%, transparent 70%);
    animation: shimmer 3s ease-in-out infinite alternate;
  }
  @keyframes shimmer {
    from { opacity: 0.7; transform: scale(1); }
    to   { opacity: 1;   transform: scale(1.05); }
  }
  #splash-particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .sp {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212,175,55,0.8), transparent 70%);
    animation: float-up linear infinite;
    opacity: 0;
  }
  @keyframes float-up {
    0%   { transform: translateY(0) scale(0.5); opacity: 0; }
    20%  { opacity: 0.6; }
    80%  { opacity: 0.3; }
    100% { transform: translateY(-100vh) scale(1.2); opacity: 0; }
  }
  #splash-text {
    position: relative;
    z-index: 2;
    text-align: center;
  }
  #splash-letters {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(64px, 14vw, 120px);
    font-weight: 700;
    line-height: 1;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 2px;
    filter: drop-shadow(0 0 30px rgba(212,175,55,0.5));
  }
  #splash-letters span {
    display: inline-block;
    background: linear-gradient(160deg, #f9e97a 0%, #d4af37 40%, #f0c040 70%, #b8860b 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0;
    transform: translateY(20px) rotate(-8deg);
    animation: letter-in 0.45s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }
  #splash-letters span:nth-child(1) { animation-delay: 0.2s; }
  #splash-letters span:nth-child(2) { animation-delay: 0.45s; }
  #splash-letters span:nth-child(3) { animation-delay: 0.65s; }
  #splash-letters span:nth-child(4) { animation-delay: 0.85s; }
  #splash-letters span:nth-child(5) { animation-delay: 1.05s; }
  #splash-letters .splash-num { animation-delay: 1.3s; font-size: 0.75em; }
  #splash-letters span:nth-child(7) { animation-delay: 1.5s; }
  @keyframes letter-in {
    to { opacity: 1; transform: translateY(0) rotate(0deg); }
  }
  #splash-subtitle {
    margin-top: 24px;
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(13px, 2vw, 16px);
    letter-spacing: 0.25em;
    color: rgba(212,175,55,0.75);
    opacity: 0;
    animation: fade-in 0.8s ease 2.2s forwards;
  }
  #splash-line {
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212,175,55,0.6), transparent);
    margin: 14px auto 0;
    animation: expand-line 0.8s ease 2.4s forwards;
  }
  @keyframes fade-in {
    to { opacity: 1; }
  }
  @keyframes expand-line {
    to { width: 200px; }
  }
  #splash.hide {
    animation: splash-out 0.7s ease forwards;
  }
  @keyframes splash-out {
    0%   { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.04); pointer-events: none; }
  }

  /* ===== MAIN ===== */
  #bg-root, #bg-root * { box-sizing: border-box; }
  #bg-root {
    --paper: #F5F0E4;
    --paper-line: #E3D9C2;
    --ink: #2B2620;
    --ink-soft: #6B6152;
    --forest: #2F5D4E;
    --forest-dark: #1E4235;
    --gold: #B4862B;
    --gold-soft: #EFD9A0;
    --clay: #A6473D;
    --clay-soft: #F3D9CE;
    --sage: #DCE6DA;
    --card: #FFFDF8;
    --shadow: 0 2px 10px rgba(43,38,32,0.08), 0 1px 2px rgba(43,38,32,0.06);
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }
  #bg-root .serif { font-family: 'Noto Serif KR', serif; }
  #bg-root::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: radial-gradient(rgba(43,38,32,0.035) 1px, transparent 1px);
    background-size: 14px 14px;

  .spiral {

    border-right: 1px solid var(--paper-line);

    padding-top: 40px; gap: 22px;

  .spiral span {
    width: 12px; height: 12px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff, #cfc2a0 60%, #b3a480);
    box-shadow: inset 0 0 0 1px rgba(43,38,32,0.15);

  @media (max-width: 640px) { .spiral { display: none; } }
  .shell { position: relative; z-index: 1; margin-left: 26px; min-height: 100vh; }
  @media (max-width: 640px) { .shell { margin-left: 0; } }
  .container { max-width: 880px; margin: 0 auto; padding: 28px 22px 80px; }
  .topbar {

  .brand .name { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 19px; letter-spacing: -0.2px; }
  .who { font-size: 13px; color: var(--ink-soft); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .who button {
    border: 1px solid var(--paper-line); background: var(--card); color: var(--ink-soft);
    padding: 6px 12px; border-radius: 999px; font-size: 12.5px; cursor: pointer;
  }
  .who button:hover { background: var(--sage); color: var(--forest-dark); }
  .landing { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .landing-inner { max-width: 720px; width: 100%; text-align: center; }
  .landing-title { font-family: 'Noto Serif KR', serif; font-weight: 900; font-size: 36px; letter-spacing: -0.5px; margin-bottom: 8px; }
  .landing-sub { color: var(--ink-soft); font-size: 15px; margin-bottom: 40px; }
  .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 560px) { .role-grid { grid-template-columns: 1fr; } }
  .role-card {
    background: var(--card); border: 1px solid var(--paper-line); border-radius: 16px;
    padding: 30px 22px; cursor: pointer; text-align: left; box-shadow: var(--shadow);
    transition: transform .15s ease, box-shadow .15s ease; position: relative; overflow: hidden;
  }
  .role-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(43,38,32,0.14); }
  .role-card .tab {

.field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 6px; font-weight: 500; }
  .field input, .field textarea, .field select {

  .cal-wd { text-align: center; font-size: 11.5px; color: var(--ink-soft); font-weight: 700; padding-bottom: 4px; }
  .cal-cell {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 10px;
    font-size: 12px; border: 1px solid var(--paper-line); background: #fff; color: var(--ink-soft); position: relative;
  }
  .cal-cell.empty-cell { border: none; background: transparent; }

<script>
(function(){
  const shell = document.getElementById('shell');
  let saving = false;

  const DEFAULT_CONFIG = {
    password: '0000',
    sections: [
      { key: 'daily', label: '읽다', color: '#2F5D4E' },
      { key: 'stickers', label: '쌓다', color: '#B4862B' },
      { key: 'book', label: '잇다', color: '#B4862B' },
      { key: 'free', label: '짓다', color: '#5B7A9E' },
      { key: 'memo', label: '쓰다', color: '#7A5C3E' },
      { key: 'mine', label: '담다', color: '#6B6152' },
    ],
    themeColor: '#2F5D4E',
  };

  const state = {
    role: null,
    studentName: null,
    tab: 'daily',
    teacherView: 'list',
    teacherSelected: null,
    students: [],
    record: null,
    loading: false,
    config: null,
  };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function fmtDate(s){
    if(!s) return '';
    const d = new Date(s + (s.length===10?'T00:00:00':''));
    return `${d.getMonth()+1}월 ${d.getDate()}일`;
  }
  function fmtDateFull(s){
    if(!s) return '';
    const d = new Date(s + (s.length===10?'T00:00:00':''));
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  }
  function getWeekKey(dateStr){
    const date = new Date(dateStr + 'T00:00:00');
    date.setDate(date.getDate() + 3 - ((date.getDay()+6)%7));
    const week1 = new Date(date.getFullYear(),0,4);
    const weekNo = 1 + Math.round(((date - week1) / 86400000 - 3 + ((week1.getDay()+6)%7))/7);
    return `${date.getFullYear()}-W${String(weekNo).padStart(2,'0')}`;
  }
  function esc(str){
    return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function pad2(n){ return String(n).padStart(2,'0'); }
  function monthKey(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
  }
  function monthLabel(ym){ const [y,m] = ym.split('-').map(Number); return `${y}년 ${m}월`; }
  function shiftMonth(ym, delta){
    let [y,m] = ym.split('-').map(Number);
    m += delta;
    if(m<1){ m=12; y--; } if(m>12){ m=1; y++; }
    return `${y}-${pad2(m)}`;
  }
  function cfg(){ return state.config || DEFAULT_CONFIG; }
  function sectionLabel(key){ const s = cfg().sections.find(x=>x.key===key); return s ? s.label : key; }
  function sectionColor(key){ const s = cfg().sections.find(x=>x.key===key); return s ? s.color : '#2F5D4E'; }
  function applyTheme(){
    const c = cfg();
    const root = document.getElementById('bg-root');
    if(c.themeColor) root.style.setProperty('--forest', c.themeColor);
  }

  function calendarStats(record, ym){
    const [y,m] = ym.split('-').map(Number);
    const dim = new Date(y, m, 0).getDate();
    const todayS = todayStr();
    const dailyDates = new Set(record.entries.filter(e=>e.type==='daily').map(e=>e.date));
    const freeDates  = new Set(record.entries.filter(e=>e.type==='free').map(e=>e.date));
    const bookDates  = new Set(record.entries.filter(e=>e.type==='book').map(e=>e.date));
    const wsDates = new Set(Object.values(record.worksheets||{}).filter(w=>w.submittedAt).map(w=>w.submittedAt.slice(0,10)));
    const firstDow = new Date(y, m-1, 1).getDay();
    const cells = [];
    for(let i=0;i<firstDow;i++) cells.push(null);
    let got = 0, elapsed = 0;
    for(let d=1; d<=dim; d++){
      const ds = `${y}-${pad2(m)}-${pad2(d)}`;
      const isFuture = ds > todayS;
      const has = dailyDates.has(ds);
      const hasFree = freeDates.has(ds);
      const hasBook = bookDates.has(ds);
      const hasWs = wsDates.has(ds);
      if(!isFuture){ elapsed++; if(has) got++; }
      cells.push({ day:d, date:ds, has, hasFree, hasBook, hasWs, isFuture, isToday: ds===todayS });
    }
    const isCurrentMonth = ym === monthKey(todayS);
    return { y, m, dim, cells, got, elapsed, isCurrentMonth };
  }
  function calendarHtml(stats, idPrefix){
    const weekdayNames = ['일','월','화','수','목','금','토'];
    const perfectPast = !stats.isCurrentMonth && stats.dim>0 && stats.got===stats.dim;
    const perfectSoFar = stats.isCurrentMonth && stats.elapsed>0 && stats.got===stats.elapsed;
    return `
      <div class="cal-head">
        <button class="navbtn" id="${idPrefix}-prev">‹</button>
        <div class="cal-title">${monthLabel(idPrefix==='cal'?state.stickerMonth:state.teacherStickerMonth)}</div>
        <button class="navbtn" id="${idPrefix}-next">›</button>
      </div>
      <div class="cal-grid">
        ${weekdayNames.map(w=>`<div class="cal-wd">${w}</div>`).join('')}
        ${stats.cells.map(c=>{
          if(!c) return `<div class="cal-cell empty-cell"></div>`;
          const anySticker = !c.isFuture && (c.has || c.hasFree || c.hasBook || c.hasWs);
          let cls = '';
          if(c.isFuture) cls = '';
          else if(c.has && (c.hasFree || c.hasBook)) cls = 'got-multi';
          else if(c.has) cls = 'got';
          else if(c.hasFree && c.hasBook) cls = 'got-multi';
          else if(c.hasFree) cls = 'got-free';
          else if(c.hasBook) cls = 'got-book';
          else if(c.hasWs) cls = 'got-vocab';
          else cls = 'miss';
          const stickers = !c.isFuture ? [
            c.has    ? '⭐' : '',
            c.hasFree ? '<span style="color:#E87070;">★</span>' : '',
            c.hasBook ? '<span style="color:#9B70C8;">★</span>' : '',
            c.hasWs   ? '<span style="color:#2E7D32;">★</span>' : '',
          ].filter(Boolean).join('') : '';
          return `<div class="cal-cell ${cls} ${c.isToday?'today':''}">${anySticker ? `<div class="sticker-row">${stickers}</div>` : `<span class="num">${c.day}</span>`}</div>`;
        }).join('')}
      </div>
      <div class="cal-summary">이번 달 스티커 <b>${stats.got}</b> / ${stats.isCurrentMonth ? stats.elapsed : stats.dim}일
        ${perfectPast ? `<span class="perfect-badge">🎁 개근 달성! 선물 받을 수 있어요</span>` : perfectSoFar ? `<span class="perfect-badge">✨ 지금까지 매일 성공 중!</span>` : ''}
      </div>`;
  }
  function toast(msg){
    document.querySelectorAll('.toast').forEach(t=>t.remove());
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 2500);
  }

  function btnSaving(btn){
    btn.disabled = true;
    btn.dataset.origText = btn.textContent;
    btn.textContent = '저장 중...';
    btn.classList.add('btn-saving');
  }
  function btnDone(btn){
    btn.classList.remove('btn-saving');
    btn.classList.add('btn-done');
    btn.textContent = '저장 완료!';
    setTimeout(()=>{
      btn.classList.remove('btn-done');
      btn.disabled = false;
      btn.textContent = btn.dataset.origText || '저장';
    }, 1500);
  }
  function btnReset(btn){
    btn.classList.remove('btn-saving');
    btn.disabled = false;
    btn.textContent = btn.dataset.origText || '저장';
  }

  function revisionsHtml(entry){
    const revs = entry.revisions;
    if(!revs || !revs.length) return '';
    return `
      <button class="rev-toggle" data-id="${entry.id}">이전 수정 내역 (${revs.length}건) ▾</button>
      <div class="rev-list" id="revs-${entry.id}" style="display:none;">
        ${revs.slice().reverse().map((r,i)=>`
          <div class="rev-item">
            <div class="rev-head">${revs.length - i}차 수정 전 · ${fmtDate(r.date)}</div>
            ${r.title ? `<div style="font-weight:600;margin-bottom:2px;">${esc(r.title)}</div>` : ''}
            <div class="rev-body">${esc(r.content || r.note || r.review || '')}</div>
          </div>
        `).join('')}
      </div>`;
  }
  function bindRevisionToggles(container){
    container.querySelectorAll('.rev-toggle').forEach(btn=>{
      btn.onclick = (e) => {
        e.stopPropagation();
        const list = document.getElementById('revs-' + btn.dataset.id);
        if(list){
          const open = list.style.display !== 'none';
          list.style.display = open ? 'none' : 'block';
          btn.textContent = btn.textContent.replace(open ? '▴' : '▾', open ? '▾' : '▴');
        }
      };
    });
  }

  // ---------- Firestore storage ----------
  async function loadStudents(){
    try {
      const doc = await db.collection('meta').doc('students').get();
      return doc.exists ? doc.data().list : [];
    } catch(e){ console.error(e); return []; }
  }
  async function saveStudents(list){
    try { await db.collection('meta').doc('students').set({ list }); } catch(e){ console.error(e); }
  }
  async function loadRecord(name){
    try {
      const doc = await db.collection('records').doc(name).get();
      return doc.exists ? doc.data() : { entries: [] };
    } catch(e){ console.error(e); return { entries: [] }; }
  }
  async function saveRecord(name, rec){
    try { await db.collection('records').doc(name).set(rec); return true; }
    catch(e){ console.error(e); toast('저장에 실패했어요. 다시 시도해 주세요.'); return false; }
  }
  async function deleteRecord(name){
    try { await db.collection('records').doc(name).delete(); return true; }
    catch(e){ console.error(e); return false; }
  }
  async function ensureStudent(name){
    let list = await loadStudents();
    if(!list.includes(name)){
      list.push(name);
      await saveStudents(list);
    }
    state.students = list;
  }
  async function loadConfig(){
    try {
      const doc = await db.collection('meta').doc('config').get();
      if(doc.exists){
        const data = doc.data();
        const fbKeys = new Set((data.sections||[]).map(s=>s.key));
        const missing = DEFAULT_CONFIG.sections.filter(s=>!fbKeys.has(s.key));
        data.sections = [...(data.sections||[]), ...missing];
        state.config = { ...DEFAULT_CONFIG, ...data };
      } else {
        state.config = { ...DEFAULT_CONFIG };
      }
    } catch(e){ state.config = { ...DEFAULT_CONFIG }; }
  }
  async function saveConfig(c){
    state.config = c;
    try { await db.collection('meta').doc('config').set(c); return true; }
    catch(e){ console.error(e); toast('설정 저장에 실패했어요.'); return false; }
  }


  // ---------- Excel download ----------
  function downloadAllRecordsExcel(){
    const students = state.teacherStudents || [];
    if(!students.length){ toast('다운로드할 학생 기록이 없어요.'); return; }

    let rows = [];
    students.forEach(s => {
      s.record.entries.sort((a,b)=>a.createdAt-b.createdAt).forEach(e => {
        const typeName = e.type==='daily' ? sectionLabel('daily') : (e.type==='book' ? sectionLabel('book') : sectionLabel('free'));
        const title = e.type==='daily' ? (e.bookTitle||'') : (e.title||'');
        const body = e.type==='daily' ? (e.note||'') : (e.type==='book' ? (e.review||'') : (e.content||''));
        const fb = e.feedback ? e.feedback.text : '';
        const fbDate = e.feedback ? fmtDateFull(e.feedback.at) : '';
        const extra = e.type==='daily' ? (e.pagesRead||'') : (e.type==='book' ? `${e.author||''} / ${'★'.repeat(e.rating||0)}${'☆'.repeat(5-(e.rating||0))}` : '');
        const revCount = (e.revisions && e.revisions.length) || 0;
        rows.push({ name: s.name, type: typeName, date: fmtDateFull(e.date), title, extra, body, fb, fbDate, revCount });
      });
    });

    const xmlHead = '<?xml version="1.0" encoding="UTF-8"?>\n<?mso-application progid="Excel.Sheet"?>\n';
    const ssOpen = '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n<Styles><Style ss:ID="h"><Font ss:Bold="1" ss:Size="11"/><Interior ss:Color="#DCE6DA" ss:Pattern="Solid"/></Style></Styles>\n<Worksheet ss:Name="전체기록"><Table>\n';
    const ssClose = '</Table></Worksheet></Workbook>';
    const cell = (v) => `<Cell><Data ss:Type="String">${esc(v)}</Data></Cell>`;
    const headerRow = '<Row ss:StyleID="h">' + ['학생이름','유형','날짜','제목','추가정보','내용','피드백','피드백날짜','수정횟수'].map(h=>cell(h)).join('') + '</Row>\n';
    const dataRows = rows.map(r => '<Row>' + [r.name, r.type, r.date, r.title, r.extra, r.body, r.fb, r.fbDate, String(r.revCount)].map(v=>cell(v)).join('') + '</Row>\n').join('');

    const xml = xmlHead + ssOpen + headerRow + dataRows + ssClose;
    const blob = new Blob([xml], { type: 'application/vnd.ms-excel;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `GA_읽다잇다_전체기록_${todayStr()}.xls`;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 100);
    toast('엑셀 파일을 다운로드했어요.');
  }

  // ---------- render root ----------
  function render(){

    document.getElementById('pick-teacher').onclick = () => { state.role='teacher-gate'; renderTeacherGate(); };

  // ---------- teacher password gate ----------
  function renderTeacherGate(){
    shell.innerHTML = `
      ${topbar(`<button id="home">처음으로</button>`)}
      <div class="container">
        <div class="gate">
          <h2 class="serif">선생님 로그인</h2>

  // ---------- student app ----------
  function tabsHtml(){
    const sections = cfg().sections;
    const tabs = [...sections];
    if(isPelchiUser()){
      const stickerIdx = tabs.findIndex(t=>t.key==='stickers');
      const pelchi = { key:'pelchi', label:'펼치다', color:'#6B4FA8' };
      if(stickerIdx >= 0) tabs.splice(stickerIdx, 0, pelchi);
      else tabs.push(pelchi);

    return `<div class="tabbar">${tabs.map(s=>
      `<button class="tabbtn ${state.tab===s.key?'active':''}" data-tab="${s.key}" style="${state.tab===s.key?`background:${s.color};`:''}">${esc(s.label)}</button>`

  // ---------- 비밀번호 잠금 헬퍼 ----------
  function isEntryLocked(entry){
    if(!entry.password) return false;
    if(!state.unlockedEntries) state.unlockedEntries = {};
    return !state.unlockedEntries[entry.id];
  }
  function lockOverlayHtml(entry){
    return `<div class="lock-overlay" data-id="${entry.id}">
      <span style="font-size:22px;">🔒</span>
      <div style="font-size:13px;color:var(--ink-soft);margin:4px 0 10px;">비밀 기록이에요. 비밀번호를 입력해 주세요.</div>
      <div style="display:flex;gap:8px;justify-content:center;">
        <input type="password" class="lock-pw-input" data-id="${entry.id}" placeholder="비밀번호" maxlength="20"
          style="border:1px solid var(--paper-line);border-radius:8px;padding:8px 10px;font-size:14px;width:160px;"/>
        <button class="btn btn-primary btn-sm lock-pw-confirm" data-id="${entry.id}">확인</button>
      </div>
      <div class="lock-pw-err" id="lkerr-${entry.id}" style="color:var(--clay);font-size:12.5px;margin-top:6px;min-height:16px;"></div>
    </div>`;
  }
  function pwFieldHtml(labelText){
    return `<div class="field" style="margin-top:10px;">
      <label>${labelText} <span style="font-weight:400;color:var(--ink-soft);">(선택 · 비워두면 공개)</span></label>
      <input class="entry-pw-field" type="password" placeholder="비밀번호 입력 (선택사항)" maxlength="20" autocomplete="new-password"/>
    </div>`;
  }
  function bindLockOverlays(container, onUnlock){
    if(!state.unlockedEntries) state.unlockedEntries = {};
    container.querySelectorAll('.lock-pw-confirm').forEach(btn=>{
      const tryUnlock = () => {
        const id = btn.dataset.id;
        const input = container.querySelector(`.lock-pw-input[data-id="${id}"]`);
        const entry = state.record.entries.find(e=>e.id===id);
        if(!entry || !input) return;
        if(input.value === entry.password){
          state.unlockedEntries[id] = true;
          if(onUnlock) onUnlock();
        } else {
          const err = document.getElementById('lkerr-'+id);
          if(err) err.textContent = '비밀번호가 틀렸어요.';
          input.value = ''; input.focus();
        }
      };
      btn.onclick = tryUnlock;
      const input = container.querySelector(`.lock-pw-input[data-id="${btn.dataset.id}"]`);
      if(input) input.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
    });
  }

  function bindDeleteButtons(container, label, rerender){
    container.querySelectorAll('.entry-del-btn').forEach(btn=>{
      btn.onclick = async ()=>{
        if(saving) return;
        const id = btn.dataset.id;
        const entry = state.record.entries.find(e=>e.id===id);
        if(!entry) return;
        if(isEntryLocked(entry)){ toast('비밀번호를 먼저 확인해야 삭제할 수 있어요.'); return; }
        if(!confirm(`이 ${label}을 삭제할까요? 되돌릴 수 없어요.`)) return;
        saving = true;
        state.record.entries = state.record.entries.filter(e=>e.id!==id);
        const ok = await saveRecord(state.studentName, state.record);
        saving = false;
        if(ok){ toast(`${label}을 삭제했어요.`); rerender(); }
        else { state.record.entries.push(entry); toast('저장에 실패했어요.'); }
      };
    });
  }

    if(bReview && bCharcount){

        bCharcount.style.color = n >= 500 ? 'var(--forest)' : 'var(--clay)';
      };
      bReview.addEventListener('input', updateCount);
      updateCount();
    }
    let rating = 0;
    const stars = panel.querySelectorAll('#b-stars span');
    stars.forEach(s=>{
      s.onclick = () => { rating = parseInt(s.dataset.n); stars.forEach(x=>x.classList.toggle('on', parseInt(x.dataset.n)<=rating)); };
    });
    document.getElementById('b-save').onclick = async () => {
      if(saving) return;
      const btn = document.getElementById('b-save');
      const title = document.getElementById('b-title').value.trim();
      const author = document.getElementById('b-author').value.trim();
      const start = document.getElementById('b-start').value;
      const end = document.getElementById('b-end').value;
      const quote = document.getElementById('b-quote').value.trim();
      const review = document.getElementById('b-review').value.trim();
      const pw = panel.querySelector('.entry-pw-field')?.value.trim() || '';
      if(!title || !review){ toast('책 제목과 감상을 입력해 주세요.'); return; }
      if(review.length < 500){ toast(`감상 내용이 너무 짧아요. 띄어쓰기 포함 500자 이상 써야 저장돼요. (현재 ${review.length}자)`); return; }
      const dup = state.record.entries.find(e=> e.type==='book' && e.title===title && e.review===review);
      if(dup){ toast('이미 같은 내용의 기록이 있어요.'); return; }
      saving = true;
      btnSaving(btn);
      const entry = { id:uid(), type:'book', date:end||todayStr(), createdAt:Date.now(), title, author, startDate:start, endDate:end, quote, review, rating, feedback:null };
      if(pw) entry.password = pw;
      state.record.entries.push(entry);
      const ok = await saveRecord(state.studentName, state.record);
      saving = false;
      if(ok){ btnDone(btn); toast(pw ? '비밀 완독 기록을 저장했어요. 🔒' : '완독 기록을 저장했어요.'); setTimeout(()=>render(), 1200); }
      else { btnReset(btn); state.record.entries.pop(); }
    };
  }

  function renderMemoTab(panel){
    const memos = state.record.entries.filter(e=>e.type==='memo').sort((a,b)=>b.createdAt-a.createdAt);
    panel.innerHTML = `
      <div class="section-title serif">쓰다 · 일상 메모</div>
      <div class="section-desc">순간순간의 생각과 일상을 자유롭게 기록해요. 비밀번호를 설정하면 나만 볼 수 있어요.</div>
      <div id="memo-compose-area">
        <div class="memo-compose">
          <div class="memo-compose-label">✏️ 오늘 ${fmtDate(todayStr())} — 새 메모 작성</div>
          <textarea id="memo-new-content" placeholder="지금 이 순간을 기록해 보세요..."></textarea>
          ${pwFieldHtml('🔒 비밀번호 설정')}
          <div class="memo-save-row">
            <button class="btn btn-primary" id="memo-new-save" style="font-size:13px;padding:8px 18px;">저장</button>
          </div>
        </div>
      </div>
      <div id="memo-list">
        ${memos.length ? memos.map((m)=>{
          const locked = isEntryLocked(m);
          return `<div class="memo-card" id="mcard-${m.id}">
            <div class="memo-card-head" data-id="${m.id}">
              <span class="memo-card-date">${fmtDateFull(m.date)}${m.updatedAt ? ' · 수정됨' : ''}${m.password?' 🔒':''}</span>
              <span class="memo-card-preview">${locked ? '비밀 메모예요' : esc(m.content.replace(/\n/g,' '))}</span>
              <div class="memo-card-actions">
                ${!locked ? `<button class="memo-btn memo-btn-edit" data-id="${m.id}">수정</button>` : ''}
                <button class="memo-btn memo-btn-del" data-id="${m.id}">삭제</button>
              </div>
            </div>
            <div class="memo-body hidden" id="mbody-${m.id}">
              ${locked ? lockOverlayHtml(m) : `
              <div class="memo-content-view" id="mview-${m.id}">${esc(m.content)}</div>
              <textarea class="memo-editor hidden" id="medit-${m.id}">${esc(m.content)}</textarea>
              <div class="memo-save-row hidden" id="msave-${m.id}">
                <button class="memo-btn" style="background:var(--paper-line);color:var(--ink-soft);" data-cancel="${m.id}">취소</button>
                <button class="btn btn-primary memo-btn" style="font-size:13px;padding:6px 16px;" data-save="${m.id}">저장</button>
              </div>`}
            </div>
          </div>`;
        }).join('') : `<div class="empty"><div class="big">📝</div>아직 메모가 없어요.<br>첫 번째 순간을 기록해 보세요.</div>`}
      </div>
    `;

    // 새 메모 저장
    document.getElementById('memo-new-save').onclick = async () => {
      if(saving) return;
      const content = document.getElementById('memo-new-content').value.trim();
      if(!content){ toast('내용을 입력해 주세요.'); return; }
      const pw = panel.querySelector('.entry-pw-field')?.value.trim() || '';
      const btn = document.getElementById('memo-new-save');
      saving = true; btnSaving(btn);
      const entry = { id:uid(), type:'memo', date:todayStr(), createdAt:Date.now(), content };
      if(pw) entry.password = pw;
      state.record.entries.push(entry);
      const ok = await saveRecord(state.studentName, state.record);
      saving = false;
      if(ok){ btnDone(btn); toast(pw ? '비밀 메모를 저장했어요. 🔒' : '메모를 저장했어요.'); setTimeout(()=>render(), 1000); }
      else { btnReset(btn); state.record.entries.pop(); }
    };

    // 카드 헤더 클릭 → 본문 토글
    panel.querySelectorAll('.memo-card-head').forEach(h=>{
      h.onclick = (e)=>{ if(e.target.closest('button')) return; document.getElementById('mbody-'+h.dataset.id).classList.toggle('hidden'); };
    });

    bindLockOverlays(panel, ()=>renderMemoTab(panel));

    // 수정 버튼
    panel.querySelectorAll('.memo-btn-edit').forEach(btn=>{
      btn.onclick = ()=>{
        const id = btn.dataset.id;
        document.getElementById('mbody-'+id).classList.remove('hidden');
        document.getElementById('mview-'+id).classList.add('hidden');
        document.getElementById('medit-'+id).classList.remove('hidden');
        document.getElementById('msave-'+id).classList.remove('hidden');
        document.getElementById('medit-'+id).focus();
      };
    });

    // 취소 버튼
    panel.querySelectorAll('[data-cancel]').forEach(btn=>{
      btn.onclick = ()=>{
        const id = btn.dataset.cancel;
        const orig = state.record.entries.find(e=>e.id===id);
        document.getElementById('medit-'+id).value = orig?.content||'';
        document.getElementById('mview-'+id).classList.remove('hidden');
        document.getElementById('medit-'+id).classList.add('hidden');
        document.getElementById('msave-'+id).classList.add('hidden');
      };
    });

    // 저장 버튼 (수정)
    panel.querySelectorAll('[data-save]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(saving) return;
        const id = btn.dataset.save;
        const content = document.getElementById('medit-'+id).value.trim();
        if(!content){ toast('내용을 입력해 주세요.'); return; }
        const entry = state.record.entries.find(e=>e.id===id);
        if(!entry) return;
        if(entry.content === content){ toast('변경된 내용이 없어요.'); return; }
        saving = true; btnSaving(btn);
        entry.content = content; entry.updatedAt = Date.now();
        const ok = await saveRecord(state.studentName, state.record);
        saving = false;
        if(ok){ btnDone(btn); toast('메모를 수정했어요.'); setTimeout(()=>render(), 1000); }
        else { btnReset(btn); }
      };
    });

    // 삭제 버튼
    panel.querySelectorAll('.memo-btn-del').forEach(btn=>{
      btn.onclick = async ()=>{
        if(saving) return;
        const id = btn.dataset.id;
        const entry = state.record.entries.find(e=>e.id===id);
        if(isEntryLocked(entry)){
          toast('비밀번호를 먼저 확인해야 삭제할 수 있어요.');
          document.getElementById('mbody-'+id)?.classList.remove('hidden');
          return;
        }
        if(!confirm('이 메모를 삭제할까요?')) return;
        saving = true;
        state.record.entries = state.record.entries.filter(e=>e.id!==id);
        const ok = await saveRecord(state.studentName, state.record);
        saving = false;
        if(ok){ toast('메모를 삭제했어요.'); render(); }
        else { state.record.entries.push(entry); }
      };
    });
  }

  function isPelchiUser(){
    return state.studentName && /^(22|23|24)기/.test(state.studentName);
  }

  function studentGrade(){
    const m = state.studentName && state.studentName.match(/^(\d+)기/);
    return m ? m[1]+'기' : null;
  }

  async function loadWorksheets(){
    try {
      const doc = await db.collection('meta').doc('worksheets').get();
      let items = (doc.exists && doc.data().items) ? doc.data().items : [];
      // BUILTIN에 새로 추가된 항목이 있으면 앞에 병합
      const newBuiltins = BUILTIN_WORKSHEETS.filter(b => !items.find(w => w.id === b.id));
      if(newBuiltins.length > 0){
        items = [...newBuiltins, ...items];
        await db.collection('meta').doc('worksheets').set({ items });
      }
      if(items.length === 0){
        await db.collection('meta').doc('worksheets').set({ items: BUILTIN_WORKSHEETS });
        return [...BUILTIN_WORKSHEETS];
      }
      return items;
    } catch(e){ return [...BUILTIN_WORKSHEETS]; }
  }

  async function saveWorksheets(items){
    try { await db.collection('meta').doc('worksheets').set({ items }); return true; }
    catch(e){ toast('저장 실패: ' + e.message); return false; }
  }

  async function renderPelchiTab(panel){
    const grade = studentGrade();
    const all = await loadWorksheets();
    const mine = all.filter(w=> w.grades && w.grades.includes(grade));
    if(!mine.length){
      panel.innerHTML = `<div class="section-title serif">펼치다 · 활동지</div><div class="empty"><div class="big">📄</div>아직 등록된 활동지가 없어요.<br/>선생님이 활동지를 올리면 여기에 나타나요.</div>`;
      return;
    }
    const wsAnswers = state.record.worksheets || {};

    let html = `<div class="section-title serif">펼치다 · 활동지</div>`;
    html += mine.map(ws=>{
      const ans = wsAnswers[ws.id] || {};
      const submitted = ans.submittedAt;
      const sectHtml = ws.sections.map((sec,si)=>{
        if(sec.type === 'provided'){
          return `<div class="ws-section">
            <div class="ws-section-label">${esc(sec.label)}</div>
            <div class="ws-provided">${esc(sec.content)}</div>
          </div>`;
        }
        if(sec.type === 'write'){
          const val = ans[`s${si}`] || '';
          if(submitted){
            return `<div class="ws-section">
              <div class="ws-section-label">${esc(sec.label)}</div>
              <div class="ws-submitted">${esc(val)||'<span style="color:var(--ink-soft)">(미작성)</span>'}</div>
            </div>`;
          }
          return `<div class="ws-section">
            <div class="ws-section-label">${esc(sec.label)}</div>
            <textarea class="ws-textarea" data-sid="${si}" placeholder="${esc(sec.placeholder||'내용을 작성해 주세요.')}">${esc(val)}</textarea>
          </div>`;
        }
        if(sec.type === 'questions'){
          const qHtml = sec.questions.map((q,qi)=>{
            const key = `s${si}_q${qi}`;
            const val = ans[key] || '';
            if(submitted){
              return `<div class="ws-q">
                <div class="ws-q-text">${esc(q)}</div>
                <div class="ws-submitted">${esc(val)||'<span style="color:var(--ink-soft)">(미작성)</span>'}</div>
              </div>`;
            }
            return `<div class="ws-q">
              <div class="ws-q-text">${esc(q)}</div>
              <textarea class="ws-textarea" data-sid="${si}" data-qid="${qi}" placeholder="답을 작성해 주세요." style="min-height:70px;">${esc(val)}</textarea>
            </div>`;
          }).join('');
          return `<div class="ws-section">
            <div class="ws-section-label">${esc(sec.label)}</div>
            ${qHtml}
          </div>`;
        }
        return '';
      }).join('');

      return `<div class="ws-card" data-wsid="${esc(ws.id)}">
        <div class="ws-card-head">
          <div class="ws-title">${esc(ws.title)}</div>
          <div class="ws-meta">${ws.grades.join(' · ')}${submitted ? ` · ✅ 제출 완료 (${fmtDate(submitted.slice(0,10))})` : ''}</div>
        </div>
        <div class="ws-body">
          ${sectHtml}
          ${submitted
            ? `<button class="btn btn-ghost btn-sm ws-edit" data-wsid="${esc(ws.id)}" style="margin-top:6px;color:var(--forest);">✏️ 수정하기</button>`
            : `<button class="btn btn-primary ws-submit" data-wsid="${esc(ws.id)}" style="margin-top:6px;">활동지 제출</button>`}
        </div>
      </div>`;
    }).join('');

    panel.innerHTML = html;

    panel.querySelectorAll('.ws-submit').forEach(btn=>{
      btn.onclick = async ()=>{
        const wsId = btn.dataset.wsid;
        const card = btn.closest('.ws-card');
        const ws = mine.find(w=>w.id===wsId);
        const save = {};
        ws.sections.forEach((sec,si)=>{
          if(sec.type === 'write'){
            const ta = card.querySelector(`.ws-textarea[data-sid="${si}"]`);
            save[`s${si}`] = ta ? ta.value.trim() : '';
          }
          if(sec.type === 'questions'){
            sec.questions.forEach((_,qi)=>{
              const ta = card.querySelector(`.ws-textarea[data-sid="${si}"][data-qid="${qi}"]`);
              save[`s${si}_q${qi}`] = ta ? ta.value.trim() : '';
            });
          }
        });
        save.submittedAt = new Date().toISOString().slice(0,10)+'T'+new Date().toTimeString().slice(0,8);
        if(!state.record.worksheets) state.record.worksheets = {};
        state.record.worksheets[wsId] = save;
        const ok = await saveRecord(state.studentName, state.record);
        if(ok){ toast('활동지를 제출했어요!'); renderPelchiTab(panel); }
      };
    });

    panel.querySelectorAll('.ws-edit').forEach(btn=>{
      btn.onclick = ()=>{
        const wsId = btn.dataset.wsid;
        const card = btn.closest('.ws-card');
        const ws = mine.find(w=>w.id===wsId);
        const ans = (state.record.worksheets || {})[wsId] || {};
        // 카드 본문을 편집 모드로 교체
        const editSectHtml = ws.sections.map((sec,si)=>{
          if(sec.type === 'provided'){
            return `<div class="ws-section">
              <div class="ws-section-label">${esc(sec.label)}</div>
              <div class="ws-provided">${esc(sec.content)}</div>
            </div>`;
          }
          if(sec.type === 'write'){
            const val = ans[`s${si}`] || '';
            return `<div class="ws-section">
              <div class="ws-section-label">${esc(sec.label)}</div>
              <textarea class="ws-textarea" data-sid="${si}" placeholder="${esc(sec.placeholder||'내용을 작성해 주세요.')}">${esc(val)}</textarea>
            </div>`;
          }
          if(sec.type === 'questions'){
            const qHtml = sec.questions.map((q,qi)=>{
              const val = ans[`s${si}_q${qi}`] || '';
              return `<div class="ws-q">
                <div class="ws-q-text">${esc(q)}</div>
                <textarea class="ws-textarea" data-sid="${si}" data-qid="${qi}" placeholder="답을 작성해 주세요." style="min-height:70px;">${esc(val)}</textarea>
              </div>`;
            }).join('');
            return `<div class="ws-section">
              <div class="ws-section-label">${esc(sec.label)}</div>
              ${qHtml}
            </div>`;
          }
          return '';
        }).join('');
        card.querySelector('.ws-body').innerHTML = editSectHtml +
          `<button class="btn btn-primary ws-resubmit" data-wsid="${esc(wsId)}" style="margin-top:6px;">다시 제출</button>`;

        card.querySelector('.ws-resubmit').onclick = async ()=>{
          const save = {};
          ws.sections.forEach((sec,si)=>{
            if(sec.type === 'write'){
              const ta = card.querySelector(`.ws-textarea[data-sid="${si}"]`);
              save[`s${si}`] = ta ? ta.value.trim() : '';
            }
            if(sec.type === 'questions'){
              sec.questions.forEach((_,qi)=>{
                const ta = card.querySelector(`.ws-textarea[data-sid="${si}"][data-qid="${qi}"]`);
                save[`s${si}_q${qi}`] = ta ? ta.value.trim() : '';
              });
            }
          });
          save.submittedAt = new Date().toISOString().slice(0,10)+'T'+new Date().toTimeString().slice(0,8);
          if(!state.record.worksheets) state.record.worksheets = {};
          state.record.worksheets[wsId] = save;
          const ok = await saveRecord(state.studentName, state.record);
          if(ok){ toast('활동지를 다시 제출했어요!'); renderPelchiTab(panel); }
        };
      };
    });
  }

  // ---------- teacher ----------
  async function loadTeacherList(){
    state.loading = true;
    await loadConfig();
    const names = await loadStudents();
    const recs = await Promise.all(names.map(n=>loadRecord(n)));
    state.teacherStudents = names.map((n,i)=>({ name:n, record:recs[i] }));
    state.loading = false;
    if(state.role==='teacher' && state.teacherView==='list') renderTeacherList();
  }

  function teacherTopbar(){
    return topbar(`<button id="t-pelchi">펼치다 현황</button><button id="t-settings">관리자 설정</button><button id="home">처음으로</button>`);
  }

  function renderTeacherList(){
    const list = state.teacherStudents;
    shell.innerHTML = `
      ${teacherTopbar()}
      <div class="container">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:6px;">
          <div class="section-title serif" style="font-size:20px;margin:0;">학생 기록 살펴보기</div>
          ${list && list.length ? `<button class="btn btn-ghost" id="dl-excel" style="gap:6px;">📥 전체 기록 내려받기 (Excel)</button>` : ''}
        </div>
        <div class="section-desc">학생을 선택하면 모든 기록을 시간순으로 보고 피드백을 남길 수 있어요.</div>
        ${!list ? `<div class="empty">불러오는 중...</div>` :
          list.length ? `<div class="stu-grid">${list.map(s=>{
            const wk = getWeekKey(todayStr());
            const hasFree = s.record.entries.some(e=>e.type==='free' && e.weekKey===wk);
            const lastDaily = s.record.entries.filter(e=>e.type==='daily').sort((a,b)=>b.createdAt-a.createdAt)[0];
            const totalEntries = s.record.entries.length;
            const needFeedback = s.record.entries.filter(e=>!e.feedback).length;
            const cs = calendarStats(s.record, monthKey(todayStr()));
            return `<div class="stu-card" data-name="${esc(s.name)}">
              <h4>${esc(s.name)}</h4>
              <div class="stat"><span class="dot ${hasFree?'dot-ok':'dot-warn'}"></span>이번 주 글쓰기 ${hasFree?'제출':'미제출'}</div>
              <div class="stat">최근 독서기록: ${lastDaily?fmtDate(lastDaily.date):'없음'}</div>
              <div class="stat">이번 달 스티커 ${cs.got} / ${cs.elapsed}일${cs.elapsed>0 && cs.got===cs.elapsed ? ' ⭐개근중' : ''}</div>
              <div class="stat">전체 기록 ${totalEntries}개 · 피드백 대기 ${needFeedback}개</div>
            </div>`;
          }).join('')}</div>` : `<div class="empty"><div class="big">🧑‍🎓</div>아직 등록된 학생이 없어요.<br/>학생이 먼저 이름으로 기록장을 열면 여기에 나타나요.</div>`}
      </div>`;
    document.getElementById('home').onclick = () => { state.role=null; render(); };
    document.getElementById('t-pelchi').onclick = () => { state.teacherView='pelchi'; render(); };
    document.getElementById('t-settings').onclick = () => { state.teacherView='settings'; render(); };
    const dlBtn = document.getElementById('dl-excel');
    if(dlBtn) dlBtn.onclick = downloadAllRecordsExcel;
    shell.querySelectorAll('.stu-card').forEach(c=>{
      c.onclick = async () => {
        state.teacherSelected = c.dataset.name;
        state.record = await loadRecord(state.teacherSelected);
        state.teacherView = 'detail';
        render();
      };
    });
  }

  function renderTeacherDetail(){
    if(!state.teacherStickerMonth) state.teacherStickerMonth = monthKey(todayStr());
    const all = [...state.record.entries].sort((a,b)=> b.createdAt-a.createdAt);
    const cs = calendarStats(state.record, state.teacherStickerMonth);
    shell.innerHTML = `
      ${teacherTopbar()}
      <div class="container">
        <div class="backlink" id="back">← 학생 목록으로</div>
        <div class="section-title serif" style="font-size:20px;">${esc(state.teacherSelected)}님의 기록</div>
        <div class="section-desc">각 기록 아래 칸에 피드백을 남기고 저장하세요.</div>
        <div class="cal-mini-wrap">${calendarHtml(cs, 'tcal')}</div>
        ${(state.record.worksheets && Object.keys(state.record.worksheets).length) ? `
        <div style="margin-bottom:16px;">
          <div class="section-title serif" style="font-size:16px;margin-bottom:6px;">펼치다 활동지 제출 현황</div>
          <div style="border:1px solid var(--paper-line);border-radius:12px;overflow:hidden;">
            <table style="width:100%;border-collapse:collapse;font-size:13px;">
              <thead><tr style="background:var(--paper-bg);border-bottom:1px solid var(--paper-line);">
                <th style="padding:8px 10px;text-align:left;">활동지</th>
                <th style="padding:8px 10px;text-align:center;">제출일</th>
              </tr></thead>
              <tbody>${Object.entries(state.record.worksheets).map(([wsId, ans])=>{
                const ws = BUILTIN_WORKSHEETS.find(w=>w.id===wsId);
                const title = ws ? ws.title : wsId;
                const date = ans.submittedAt ? ans.submittedAt.slice(0,10) : '-';
                return `<tr style="border-bottom:1px solid var(--paper-line);">
                  <td style="padding:7px 10px;">${esc(title)}</td>
                  <td style="padding:7px 10px;text-align:center;color:#1B5E20;font-weight:600;">✅ ${fmtDate(date)}</td>
                </tr>`;
              }).join('')}
              </tbody>
            </table>
          </div>
        </div>` : ''}
        ${all.length ? `<div class="entry-list">${all.map(e=>{
          const title = e.type==='daily'? e.bookTitle : e.title;
          const body = e.type==='daily'? e.note : (e.type==='book'? e.review : e.content);
          return `<div class="entry type-${e.type}" data-id="${e.id}">
            <div class="entry-top">${entryBadge(e.type)}<span class="entry-date">${fmtDate(e.date)}</span></div>
            <div class="entry-title" style="margin-top:6px;">${esc(title)}</div>
            ${e.type==='book' && e.quote ? `<div class="quote-block">"${esc(e.quote)}"</div>` : ''}
            <div class="entry-body">${esc(body)}</div>
            ${revisionsHtml(e)}
            ${feedbackHtml(e)}
            <div class="fbform">
              <textarea placeholder="짧은 피드백을 남겨 주세요." class="fb-input">${e.feedback? esc(e.feedback.text): ''}</textarea>
              <button class="btn btn-primary fb-save">저장</button>
            </div>
          </div>`;
        }).join('')}</div>` : `<div class="empty"><div class="big">📔</div>아직 이 학생의 기록이 없어요.</div>`}
      </div>`;
    document.getElementById('home').onclick = () => { state.role=null; render(); };
    document.getElementById('t-pelchi').onclick = () => { state.teacherView='pelchi'; render(); };
    document.getElementById('t-settings').onclick = () => { state.teacherView='settings'; render(); };
    document.getElementById('back').onclick = () => { state.teacherView='list'; render(); };
    document.getElementById('tcal-prev').onclick = () => { state.teacherStickerMonth = shiftMonth(state.teacherStickerMonth,-1); renderTeacherDetail(); };
    document.getElementById('tcal-next').onclick = () => { state.teacherStickerMonth = shiftMonth(state.teacherStickerMonth,1); renderTeacherDetail(); };
    bindRevisionToggles(shell);
    shell.querySelectorAll('.entry').forEach(card=>{
      const id = card.dataset.id;
      const fbBtn = card.querySelector('.fb-save');
      fbBtn.onclick = async () => {
        if(saving) return;
        const text = card.querySelector('.fb-input').value.trim();
        if(!text){ toast('피드백 내용을 입력해 주세요.'); return; }
        saving = true;
        btnSaving(fbBtn);
        const entry = state.record.entries.find(x=>x.id===id);
        entry.feedback = { text, at: todayStr() };
        const ok = await saveRecord(state.teacherSelected, state.record);
        saving = false;
        if(ok){ btnDone(fbBtn); toast('피드백을 저장했어요.'); setTimeout(()=>render(), 1200); }
        else { btnReset(fbBtn); }
      };
    });
  }

  // ---------- teacher pelchi ----------
  async function renderTeacherPelchi(){
    const students = state.teacherStudents || [];
    const allWs = await loadWorksheets();
    // 펼치다 대상 학생 (22/23/24기)
    const pelchiStudents = students.filter(s=> /^(22|23|24)기/.test(s.name));

    // 모달 상태는 state에 보존 (재렌더 시에도 유지)
    if(state.pelchiModal === undefined) state.pelchiModal = { student: null, wsId: null };

    function scoreLabel(s){ return s===3?'★★★':s===2?'★★':s===1?'★':'-'; }
    function scoreColor(s){ return s===3?'var(--forest)':s===2?'var(--gold)':s===1?'var(--clay)':'var(--ink-soft)'; }

    function renderGrid(){
      // 각 학생이 속한 기수에 맞는 활동지만 열 구성
      const gradeOf = name => { const m=name.match(/^(\d+)기/); return m?m[1]+'기':null; };
      // 전체 활동지 중 22/23/24기 관련된 것만
      const wsForGrade = (grade) => allWs.filter(w=>w.grades.includes(grade));

      // 헤더 열: 등장하는 모든 활동지 (기수별로 보여줄 것)
      // 행 = 학생, 열 = 활동지 (해당 학생 기수에 해당하는 것만 표시)
      const gradeGroups = ['22기','23기','24기'].map(grade=>{
        const studs = pelchiStudents.filter(s=>gradeOf(s.name)===grade);
        const wsList = wsForGrade(grade);
        if(!studs.length || !wsList.length) return null;
        return { grade, studs, wsList };
      }).filter(Boolean);

      if(!gradeGroups.length){
        return `<div class="empty"><div class="big">📄</div>펼치다 대상 학생(22·23·24기)이 없거나 활동지가 없어요.</div>`;
      }

      return gradeGroups.map(({grade, studs, wsList})=>`
        <div style="margin-bottom:28px;">
          <div style="font-size:14px;font-weight:700;color:var(--forest);margin-bottom:10px;">${grade}</div>
          <div style="overflow-x:auto;">
            <table style="border-collapse:collapse;width:100%;min-width:${120+wsList.length*110}px;font-size:13px;">
              <thead>
                <tr style="background:var(--sage);">
                  <th style="padding:8px 12px;text-align:left;border:1px solid var(--paper-line);white-space:nowrap;min-width:90px;">학생</th>
                  ${wsList.map(w=>{ const sub = w.title.includes('—') ? w.title.split('—').pop().trim() : w.title; return `<th style="padding:8px 10px;text-align:center;border:1px solid var(--paper-line);white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis;" title="${esc(w.title)}">${esc(sub.length>16?sub.slice(0,15)+'…':sub)}</th>`; }).join('')}
                </tr>
              </thead>
              <tbody>
                ${studs.map(s=>{
                  const wsMap = s.record.worksheets || {};
                  return `<tr>
                    <td style="padding:8px 12px;border:1px solid var(--paper-line);font-weight:600;">${esc(s.name)}</td>
                    ${wsList.map(w=>{
                      const ans = wsMap[w.id];
                      const submitted = ans && ans.submittedAt;
                      const score = ans && ans.score;
                      if(!submitted) return `<td style="padding:8px;text-align:center;border:1px solid var(--paper-line);color:var(--ink-soft);">⬜</td>`;
                      const icon = score ? '🟢' : '🟡';
                      return `<td style="padding:8px;text-align:center;border:1px solid var(--paper-line);cursor:pointer;background:${score?'var(--sage)':'#FFFDE7'};" class="ws-cell" data-student="${esc(s.name)}" data-wsid="${esc(w.id)}">
                        <div>${icon}</div>
                        ${score?`<div style="font-size:11px;color:${scoreColor(score)};font-weight:700;">${scoreLabel(score)}</div>`:'<div style="font-size:10px;color:var(--ink-soft);">미평가</div>'}
                      </td>`;
                    }).join('')}
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
          <div style="font-size:11px;color:var(--ink-soft);margin-top:6px;">⬜ 미제출 &nbsp;&nbsp; 🟡 제출 (미평가) &nbsp;&nbsp; 🟢 제출 + 평가 완료</div>
        </div>
      `).join('');
    }

    function renderModal(){
      const { student: modalStudent, wsId: modalWsId } = state.pelchiModal;
      if(!modalStudent || !modalWsId) return '';
      const s = students.find(st=>st.name===modalStudent);
      const ws = allWs.find(w=>w.id===modalWsId);
      if(!s||!ws) return '';
      const ans = (s.record.worksheets||{})[ws.id]||{};
      const score = ans.score||0;
      const comment = ans.teacherComment||'';
      const sectHtml = ws.sections.map((sec,si)=>{
        if(sec.type==='provided') return `<div style="margin-bottom:12px;"><div style="font-size:12px;font-weight:700;color:var(--forest);margin-bottom:4px;">${esc(sec.label)}</div><div style="background:var(--sage);padding:10px;border-radius:8px;font-size:12.5px;line-height:1.7;white-space:pre-wrap;">${esc(sec.content)}</div></div>`;
        if(sec.type==='write'){
          const val = ans[`s${si}`]||'';
          return `<div style="margin-bottom:12px;"><div style="font-size:12px;font-weight:700;color:var(--forest);margin-bottom:4px;">${esc(sec.label)}</div><div style="background:#fafafa;border:1px solid var(--paper-line);border-radius:8px;padding:10px;font-size:13px;line-height:1.7;white-space:pre-wrap;">${esc(val)||'<span style="color:var(--ink-soft)">(미작성)</span>'}</div></div>`;
        }
        if(sec.type==='questions'){
          return `<div style="margin-bottom:12px;"><div style="font-size:12px;font-weight:700;color:var(--forest);margin-bottom:6px;">${esc(sec.label)}</div>${sec.questions.map((q,qi)=>{
            const val = ans[`s${si}_q${qi}`]||'';
            return `<div style="margin-bottom:10px;"><div style="font-size:12.5px;font-weight:600;margin-bottom:3px;">${esc(q)}</div><div style="background:#fafafa;border:1px solid var(--paper-line);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.65;white-space:pre-wrap;">${esc(val)||'<span style="color:var(--ink-soft)">(미작성)</span>'}</div></div>`;
          }).join('')}</div>`;
        }
        return '';
      }).join('');

      return `<div id="ws-modal-bg" style="position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;">
        <div style="background:var(--card);border-radius:16px;padding:24px;max-width:600px;width:100%;position:relative;max-height:90vh;overflow-y:auto;">
          <button id="ws-modal-close" style="position:absolute;top:14px;right:14px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);">✕</button>
          <div style="font-size:16px;font-weight:700;margin-bottom:4px;">${esc(s.name)} · ${esc(ws.title)}</div>
          <div style="font-size:12px;color:var(--ink-soft);margin-bottom:16px;">제출일: ${ans.submittedAt?ans.submittedAt.slice(0,10):'-'}</div>
          <div style="border-top:1px solid var(--paper-line);padding-top:14px;margin-bottom:16px;">${sectHtml}</div>
          <div style="border-top:1px solid var(--paper-line);padding-top:14px;">
            <div style="font-size:13px;font-weight:700;margin-bottom:8px;">평가</div>
            <div style="display:flex;gap:8px;margin-bottom:10px;">
              ${[1,2,3].map(n=>`<button class="btn ${score===n?'btn-primary':'btn-ghost'} btn-sm ws-score-btn" data-score="${n}" style="${score===n?'':'border:1px solid var(--paper-line);'}">${scoreLabel(n)}</button>`).join('')}
              <button class="btn btn-ghost btn-sm ws-score-btn" data-score="0" style="border:1px solid var(--paper-line);">초기화</button>
            </div>
            <div class="field" style="margin-bottom:10px;"><label style="font-size:12px;">한 줄 코멘트 (선택)</label><textarea id="ws-modal-comment" style="min-height:60px;font-size:13px;border:1px solid var(--paper-line);border-radius:8px;padding:8px;width:100%;box-sizing:border-box;">${esc(comment)}</textarea></div>
            <button class="btn btn-primary btn-sm" id="ws-modal-save">평가 저장</button>
          </div>
        </div>
      </div>`;
    }

    shell.innerHTML = `
      ${teacherTopbar()}
      <div class="container">
        <div class="section-title serif" style="font-size:20px;margin-bottom:4px;">펼치다 · 제출 현황</div>
        <div class="section-desc" style="margin-bottom:18px;">셀을 클릭하면 학생 답안을 보고 평가할 수 있어요.</div>
        ${renderGrid()}
      </div>
      ${renderModal()}
    `;

    // topbar
    document.getElementById('home').onclick = () => { state.role=null; render(); };
    document.getElementById('t-pelchi').onclick = () => {};
    document.getElementById('t-settings').onclick = () => { state.teacherView='settings'; render(); };

    // 셀 클릭
    shell.querySelectorAll('.ws-cell').forEach(cell=>{
      cell.onclick = ()=>{
        state.pelchiModal = { student: cell.dataset.student, wsId: cell.dataset.wsid };
        renderTeacherPelchi();
      };
    });

    // 모달
    const modalBg = document.getElementById('ws-modal-bg');
    if(modalBg){
      document.getElementById('ws-modal-close').onclick = ()=>{ state.pelchiModal={student:null,wsId:null}; renderTeacherPelchi(); };
      modalBg.onclick = (e)=>{ if(e.target===modalBg){ state.pelchiModal={student:null,wsId:null}; renderTeacherPelchi(); } };

      const { student: modalStudent2, wsId: modalWsId2 } = state.pelchiModal;
      let currentScore = ((students.find(s=>s.name===modalStudent2)?.record.worksheets||{})[modalWsId2]||{}).score||0;
      shell.querySelectorAll('.ws-score-btn').forEach(btn=>{
        btn.onclick = ()=>{
          currentScore = parseInt(btn.dataset.score);
          shell.querySelectorAll('.ws-score-btn').forEach(b=>{
            const active = parseInt(b.dataset.score)===currentScore && currentScore>0;
            b.className = `btn ${active?'btn-primary':'btn-ghost'} btn-sm ws-score-btn`;
          });
        };
      });

      document.getElementById('ws-modal-save').onclick = async ()=>{
        const { student: mStu, wsId: mWsId } = state.pelchiModal;
        const s = students.find(st=>st.name===mStu);
        if(!s) return;
        if(!s.record.worksheets) s.record.worksheets = {};
        if(!s.record.worksheets[mWsId]) s.record.worksheets[mWsId] = {};
        const comment = document.getElementById('ws-modal-comment').value.trim();
        if(currentScore > 0) s.record.worksheets[mWsId].score = currentScore;
        else delete s.record.worksheets[mWsId].score;
        if(comment) s.record.worksheets[mWsId].teacherComment = comment;
        else delete s.record.worksheets[mWsId].teacherComment;
        const ok = await saveRecord(s.name, s.record);
        if(ok){ toast('평가를 저장했어요.'); state.pelchiModal={student:null,wsId:null}; renderTeacherPelchi(); }
        else toast('저장에 실패했어요.');
      };
    }
  }

  // ---------- teacher settings ----------
  async function renderTeacherSettings(){
    const c = cfg();
    const students = state.teacherStudents || [];
    const allWorksheets = await loadWorksheets();
    shell.innerHTML = `
      ${teacherTopbar()}
      <div class="container">
        <div class="backlink" id="back">← 학생 목록으로</div>
        <div class="section-title serif" style="font-size:20px;">관리자 설정</div>
        <div class="section-desc">비밀번호, 섹션, 테마, 학생을 관리할 수 있어요.</div>

        <div class="setting-card">
          <h3>비밀번호 변경</h3>
          <div class="row2">
            <div class="field"><label>현재 비밀번호</label><input id="s-pw-cur" type="password" placeholder="현재 비밀번호"/></div>
            <div class="field"><label>새 비밀번호</label><input id="s-pw-new" type="password" placeholder="새 비밀번호"/></div>
          </div>
          <button class="btn btn-primary btn-sm" id="s-pw-save">비밀번호 변경</button>
        </div>

        <div class="setting-card">
          <h3>테마 색상</h3>
          <div class="color-row">
            <label>메인 색상</label>
            <input type="color" id="s-theme-color" value="${c.themeColor || '#2F5D4E'}"/>
            <span style="font-size:12px;color:var(--ink-soft);">탭, 버튼 등의 기본 색상</span>
          </div>
          <button class="btn btn-primary btn-sm" id="s-theme-save">테마 저장</button>
        </div>

        <div class="setting-card">
          <h3>섹션 이름 · 색상 · 순서</h3>
          <div class="section-desc">이름과 색상을 수정하고, 화살표로 순서를 바꿀 수 있어요.</div>
          <div id="s-sections">
            ${c.sections.map((s,i)=>`
              <div class="sort-item" data-idx="${i}">
                <span class="handle">☰</span>
                <input class="sort-label" value="${esc(s.label)}" data-key="${s.key}" style="border:1px solid var(--paper-line);border-radius:6px;padding:4px 8px;font-size:13.5px;font-family:'Noto Sans KR',sans-serif;"/>
                <input type="color" value="${s.color}" class="sort-color" style="width:32px;height:26px;border:1px solid var(--paper-line);border-radius:4px;padding:1px;cursor:pointer;"/>
                <button class="btn btn-ghost btn-sm sort-up" ${i===0?'disabled':''}>▲</button>
                <button class="btn btn-ghost btn-sm sort-down" ${i===c.sections.length-1?'disabled':''}>▼</button>
              </div>
            `).join('')}
          </div>
          <button class="btn btn-primary btn-sm" id="s-sections-save" style="margin-top:10px;">섹션 설정 저장</button>
        </div>

        <div class="setting-card">
          <h3>펼치다 · 활동지 관리</h3>
          <div class="section-desc">활동지를 자유롭게 추가하거나 삭제할 수 있어요.</div>
          <details id="ws-add-form" style="margin-bottom:10px;">
            <summary style="cursor:pointer;font-size:13px;color:var(--forest);font-weight:700;">+ 새 활동지 추가</summary>
            <div style="margin-top:12px;display:flex;flex-direction:column;gap:8px;">
              <div class="field"><label>활동지 제목</label><input id="ws-title" placeholder="예: 오디세이아 제10권 — 키르케"/></div>
              <div class="field">
                <label>대상 기수 <span style="font-weight:400;color:var(--ink-soft);">(중복 선택 가능)</span></label>
                <div style="display:flex;gap:10px;margin-top:4px;">
                  <label style="font-size:13.5px;"><input type="checkbox" id="ws-g22" value="22기"/> 22기</label>
                  <label style="font-size:13.5px;"><input type="checkbox" id="ws-g23" value="23기"/> 23기</label>
                  <label style="font-size:13.5px;"><input type="checkbox" id="ws-g24" value="24기"/> 24기</label>
                </div>
              </div>
              <div class="field">
                <label>감상 포인트 <span style="font-weight:400;color:var(--ink-soft);">(선생님 제공 내용, 선택)</span></label>
                <textarea id="ws-provided" style="width:100%;min-height:80px;font-size:13px;border:1px solid var(--paper-line);border-radius:8px;padding:8px;box-sizing:border-box;" placeholder="학생들에게 미리 제공할 내용을 입력하세요."></textarea>
              </div>
              <div class="field">
                <label>내용 확인 질문 <span style="font-weight:400;color:var(--ink-soft);">(한 줄에 하나씩)</span></label>
                <textarea id="ws-cq" style="width:100%;min-height:80px;font-size:13px;border:1px solid var(--paper-line);border-radius:8px;padding:8px;box-sizing:border-box;" placeholder="Q1. 오디세우스가 ... &#10;Q2. 폴리페모스는 ..."></textarea>
              </div>
              <div class="field">
                <label>생각해보기 질문 <span style="font-weight:400;color:var(--ink-soft);">(한 줄에 하나씩)</span></label>
                <textarea id="ws-tq" style="width:100%;min-height:60px;font-size:13px;border:1px solid var(--paper-line);border-radius:8px;padding:8px;box-sizing:border-box;" placeholder="Q. 오디세우스의 행동에 대해 ..."></textarea>
              </div>
              <button class="btn btn-primary btn-sm" id="ws-add">활동지 등록</button>
            </div>
          </details>
          <div class="divider" style="margin:10px 0;"></div>
          <div id="ws-all-list">
            ${allWorksheets.length ? allWorksheets.map(w=>`
              <div class="ws-admin-item">
                <div style="flex:1;">
                  <div class="ws-admin-title">${esc(w.title)}</div>
                  <div class="ws-admin-grades">${w.grades.join(' · ')}</div>
                </div>
                <button class="btn btn-ghost btn-sm ws-del" data-id="${esc(w.id)}" style="color:var(--clay);white-space:nowrap;">삭제</button>
              </div>`).join('') : `<div style="color:var(--ink-soft);font-size:13px;padding:6px 0;">등록된 활동지가 없어요.</div>`}
          </div>
        </div>

        <div class="setting-card">
          <h3>학생 관리</h3>
          <div class="section-desc">등록된 학생 목록입니다. 삭제하면 해당 학생의 모든 기록이 함께 삭제됩니다.</div>
          <div id="s-students">
            ${students.length ? students.map(s=>`
              <div class="stu-manage">
                <div>
                  <div class="nm">${esc(s.name)}</div>
                  <div class="info">기록 ${s.record.entries.length}개</div>
                </div>
                <button class="btn btn-danger btn-sm stu-del" data-name="${esc(s.name)}">삭제</button>
              </div>
            `).join('') : `<div class="empty" style="padding:20px;"><div class="big">🧑‍🎓</div>등록된 학생이 없어요.</div>`}
          </div>
        </div>
      </div>`;

    document.getElementById('home').onclick = () => { state.role=null; render(); };
    document.getElementById('t-pelchi').onclick = () => { state.teacherView='pelchi'; render(); };
    document.getElementById('t-settings').onclick = () => {};
    document.getElementById('back').onclick = () => { state.teacherView='list'; render(); };

    document.getElementById('s-pw-save').onclick = async () => {
      const cur = document.getElementById('s-pw-cur').value;
      const nw = document.getElementById('s-pw-new').value;
      if(cur !== c.password){ toast('현재 비밀번호가 틀렸어요.'); return; }
      if(!nw || nw.length < 1){ toast('새 비밀번호를 입력해 주세요.'); return; }
      c.password = nw;
      const ok = await saveConfig(c);
      if(ok) toast('비밀번호가 변경되었어요.');
    };

    document.getElementById('s-theme-save').onclick = async () => {
      c.themeColor = document.getElementById('s-theme-color').value;
      const ok = await saveConfig(c);
      if(ok){ toast('테마가 저장되었어요.'); applyTheme(); }
    };

    shell.querySelectorAll('.sort-up').forEach(btn=>{
      btn.onclick = () => {
        const item = btn.closest('.sort-item');
        const idx = parseInt(item.dataset.idx);
        if(idx > 0){
          [c.sections[idx-1], c.sections[idx]] = [c.sections[idx], c.sections[idx-1]];
          renderTeacherSettings();
        }
      };
    });
    shell.querySelectorAll('.sort-down').forEach(btn=>{
      btn.onclick = () => {
        const item = btn.closest('.sort-item');
        const idx = parseInt(item.dataset.idx);
        if(idx < c.sections.length-1){
          [c.sections[idx], c.sections[idx+1]] = [c.sections[idx+1], c.sections[idx]];
          renderTeacherSettings();
        }
      };
    });

    document.getElementById('s-sections-save').onclick = async () => {
      const items = shell.querySelectorAll('.sort-item');
      items.forEach((item, i) => {
        const label = item.querySelector('.sort-label').value.trim();
        const color = item.querySelector('.sort-color').value;
        if(label) c.sections[i].label = label;
        c.sections[i].color = color;
      });
      const ok = await saveConfig(c);
      if(ok) toast('섹션 설정이 저장되었어요.');
    };

    document.getElementById('ws-add').onclick = async ()=>{
      const title = document.getElementById('ws-title').value.trim();
      if(!title){ toast('활동지 제목을 입력해 주세요.'); return; }
      const grades = ['ws-g22','ws-g23','ws-g24'].filter(id=>document.getElementById(id).checked).map(id=>document.getElementById(id).value);
      if(!grades.length){ toast('대상 기수를 하나 이상 선택해 주세요.'); return; }
      const provided = document.getElementById('ws-provided').value.trim();
      const cqRaw = document.getElementById('ws-cq').value.trim();
      const tqRaw = document.getElementById('ws-tq').value.trim();
      const sections = [
        { type:'write', label:'📝 내용 정리', placeholder:'내용을 순서대로 정리해 보세요.' }
      ];
      if(provided) sections.push({ type:'provided', label:'💡 감상 포인트', content: provided });
      if(cqRaw){
        const qs = cqRaw.split('\n').map(l=>l.trim()).filter(Boolean);
        if(qs.length) sections.push({ type:'questions', label:'✅ 내용 확인 질문', questions: qs });
      }
      if(tqRaw){
        const qs = tqRaw.split('\n').map(l=>l.trim()).filter(Boolean);
        if(qs.length) sections.push({ type:'questions', label:'🤔 생각해보기', questions: qs });
      }
      const allWs = await loadWorksheets();
      allWs.push({ id: uid(), title, grades, sections });
      const ok = await saveWorksheets(allWs);
      if(ok){ toast('활동지를 등록했어요.'); renderTeacherSettings(); }
    };

    shell.querySelectorAll('.ws-del').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.dataset.id;
        if(!confirm('이 활동지를 삭제할까요?')) return;
        const allWs = await loadWorksheets();
        const filtered = allWs.filter(w=>w.id!==id);
        const ok = await saveWorksheets(filtered);
        if(ok){ toast('활동지를 삭제했어요.'); renderTeacherSettings(); }
      };
    });

    shell.querySelectorAll('.stu-del').forEach(btn=>{
      btn.onclick = async () => {
        const name = btn.dataset.name;
        if(!confirm(`"${name}" 학생의 모든 기록을 삭제하시겠어요?\n이 작업은 되돌릴 수 없습니다.`)) return;
        let list = await loadStudents();
        list = list.filter(n=>n!==name);
        await saveStudents(list);
        await deleteRecord(name);
        toast(`${name} 학생을 삭제했어요.`);
        await loadTeacherList();
        state.teacherView = 'settings';
        render();
      };
    });

  }

  // ---------- init ----------
  (async () => {
    await loadConfig();
    render();
  })();
})();
</script>
</body>
</html>
